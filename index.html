<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perpustakaan Nawir Pakaja</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --primary: #2563eb;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    header {
      padding: 20px;
      background: var(--card);
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .theme-button {
      border: 0;
      background: var(--primary);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px 16px;
    }

    .hero {
      background: var(--card);
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .hero h2 {
      margin-top: 0;
    }

    .hero p {
      color: var(--muted);
      line-height: 1.6;
    }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
    }

    .book {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .book-icon {
      font-size: 50px;
    }

    .book h3 {
      margin-bottom: 5px;
    }

    .book p {
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <h1>📚 Perpustakaan Nawir Pakaja</h1>

    <button class="theme-button" onclick="ubahTema()">
      🌙 Dark
    </button>
  </div>
</header>

<main>

  <section class="hero">
    <h2>Selamat Datang</h2>

    <p>
      Perpustakaan digital Nawir Pakaja.
      Buku-buku nantinya dapat dikelompokkan berdasarkan
      abjad dan dibaca dalam bentuk flipbook.
    </p>
  </section>

  <section class="books">

    <div class="book">
      <div class="book-icon">📖</div>
      <h3>A</h3>
      <p>Koleksi buku huruf A</p>
    </div>

    <div class="book">
      <div class="book-icon">📖</div>
      <h3>B</h3>
      <p>Koleksi buku huruf B</p>
    </div>

    <div class="book">
      <div class="book-icon">📖</div>
      <h3>C</h3>
      <p>Koleksi buku huruf C</p>
    </div>

  </section>

</main>

<script>
  const tombolTema = document.querySelector(".theme-button");

  if (localStorage.getItem("tema") === "dark") {
    document.body.classList.add("dark");
    tombolTema.innerHTML = "☀️ Light";
  }

  function ubahTema() {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
      localStorage.setItem("tema", "dark");
      tombolTema.innerHTML = "☀️ Light";
    } else {
      localStorage.setItem("tema", "light");
      tombolTema.innerHTML = "🌙 Dark";
    }
  }
</script>

</body>
</html>
