<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perpustakaan Nawir Pakaja</title>

<style>
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --primary:#2563eb;
  --border:#e4e7ec;
}

body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#f8fafc;
  --muted:#cbd5e1;
  --border:#334155;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--card);
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.topbar{
  max-width:1100px;
  margin:auto;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.actions{
  display:flex;
  gap:8px;
}

button{
  border:0;
  cursor:pointer;
  font-size:15px;
}

.theme-btn,
.admin-btn{
  padding:10px 12px;
  border-radius:12px;
}

.theme-btn{
  background:var(--primary);
  color:white;
}

.admin-btn{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
}

main{
  max-width:1100px;
  margin:auto;
  padding:22px 16px 50px;
}

.hero{
  background:var(--card);
  padding:24px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 10px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.6;
}

.search{
  margin:20px 0;
}

.search input{
  width:100%;
  padding:16px 18px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
  outline:none;
}

.search input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.section-title{
  margin:25px 0 14px;
}

.alphabet{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:12px;
}

.letter{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px 10px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
  cursor:pointer;
  transition:.2s;
}

.letter:active{
  transform:scale(.96);
}
#bookList{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-top:30px;
}

.book-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
  display:flex;
gap:24px;
align-items:flex-start;
}

.book-card h3{
  margin-top:0;
  margin-bottom:14px;
}

.book-card p{
  margin:8px 0;
}

  .book-cover{
  width:180px;
  height:260px;
  object-fit:cover;
  border-radius:14px;
  margin:0 0 16px 0;
  display:block;
}

  .book-info{
  flex:1;
}

  .read-button{
  color:#2563eb;
  font-weight:700;
  text-decoration:none;
}

body.dark .read-button{
  color:#93c5fd;
}
  
@media (max-width:600px){
  .book-card{
    flex-direction:column;
  }

  .book-cover{
    width:160px;
    height:230px;
    margin:0 auto 16px;
  }

  .book-info{
    width:100%;
  }
}
.letter .icon{
  font-size:34px;
}

.letter h3{
  margin:8px 0 4px;
  font-size:22px;
}

.letter p{
  margin:0;
  color:var(--muted);
  font-size:12px;
}

.no-result{
  display:none;
  background:var(--card);
  padding:20px;
  border-radius:15px;
  text-align:center;
  color:var(--muted);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:50;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:400px;
  background:var(--card);
  border-radius:20px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.modal-box h2{
  margin-top:0;
}

.modal-box input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  font-size:16px;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.login-btn,
.close-btn{
  flex:1;
  padding:13px;
  border-radius:12px;
}

.login-btn{
  background:var(--primary);
  color:white;
}

.close-btn{
  background:var(--bg);
  color:var(--text);
}

footer{
  text-align:center;
  padding:25px;
  color:var(--muted);
  font-size:13px;
}

@media(max-width:500px){
  .logo{
    font-size:17px;
  }

  .theme-btn,
  .admin-btn{
    padding:9px;
    font-size:13px;
  }

  .hero h1{
    font-size:24px;
  }

  .alphabet{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="topbar">

    <div class="logo">
      📚 Perpustakaan Nawir Pakaja
    </div>

    <div class="actions">

      <button class="admin-btn" onclick="bukaAdmin()">
        🔐 Admin
      </button>

      <button class="theme-btn" onclick="ubahTema()">
        🌙 Dark
      </button>

    </div>

  </div>
</header>

<main>

  <section class="hero">

    <h1>Selamat Datang</h1>

    <p>
      Temukan dan baca koleksi buku digital
      Perpustakaan Nawir Pakaja.
      Koleksi disusun berdasarkan abjad A–Z.
    </p>

  </section>

  <div class="search">

    <input
      type="search"
      id="searchInput"
      placeholder="🔎 Cari berdasarkan abjad..."
      oninput="cariKoleksi()"
    >

  </div>

  <h2 class="section-title">
    Koleksi A–Z
  </h2>

  <section class="alphabet" id="alphabet"></section>
<section id="bookList"></section>
  <div class="no-result" id="noResult">
    📚 Koleksi tidak ditemukan.
  </div>

</main>

<footer>
  © Perpustakaan Nawir Pakaja
</footer>


<!-- MODAL ADMIN -->

<div class="modal" id="adminModal">

  <div class="modal-box">

    <h2>🔐 Admin</h2>

    <p>
      Area pengelolaan Perpustakaan Nawir Pakaja.
    </p>

    <input
      id="admin-email"
      type="email"
      placeholder="Email Admin"
      autocomplete="email"
    >

    <input
      id="admin-password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <p id="admin-login-message"></p>

    <div class="modal-actions">

      <button
        class="close-btn"
        onclick="tutupAdmin()">
        Batal
      </button>

      <button
        id="admin-login-btn"
        class="login-btn"
        onclick="loginAdmin()">
        Masuk
      </button>

    </div>

  </div>

</div>

<script>

const alphabet =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

const container =
document.getElementById("alphabet");

alphabet.forEach(huruf => {

  const card =
  document.createElement("div");

  card.className = "letter";

  card.dataset.letter = huruf;

  card.innerHTML = `
    <div class="icon">📖</div>
    <h3>${huruf}</h3>
    <p>Koleksi huruf ${huruf}</p>
  `;

  card.onclick = function(){
    bukaKoleksi(huruf);
  };

  container.appendChild(card);

});


function bukaKoleksi(huruf){

  alert(
    "Koleksi buku huruf " +
    huruf +
    " akan kita isi pada tahap berikutnya."
  );

}


function cariKoleksi(){

  const keyword =
  document
  .getElementById("searchInput")
  .value
  .trim()
  .toUpperCase();

  const cards =
  document.querySelectorAll(".letter");

  let ditemukan = false;

  cards.forEach(card => {

    const cocok =
    card.dataset.letter.includes(keyword);

    card.style.display =
    cocok ? "block" : "none";

    if(cocok){
      ditemukan = true;
    }

  });

  document
  .getElementById("noResult")
  .style.display =
  ditemukan ? "none" : "block";

}


const tombolTema =
document.querySelector(".theme-btn");


if(
  localStorage.getItem("tema")
  === "dark"
){

  document.body
  .classList
  .add("dark");

  tombolTema.innerHTML =
  "☀️ Light";

}


function ubahTema(){

  document.body
  .classList
  .toggle("dark");

  if(
    document.body
    .classList
    .contains("dark")
  ){

    localStorage
    .setItem("tema","dark");

    tombolTema.innerHTML =
    "☀️ Light";

  }else{

    localStorage
    .setItem("tema","light");

    tombolTema.innerHTML =
    "🌙 Dark";

  }

}


function bukaAdmin(){

  document
  .getElementById("adminModal")
  .classList
  .add("show");

}


function tutupAdmin(){

  document
  .getElementById("adminModal")
  .classList
  .remove("show");

}


async function loginAdmin() {

  const email =
    document.getElementById("admin-email").value.trim();

  const password =
    document.getElementById("admin-password").value;

  const message =
    document.getElementById("admin-login-message");

  const loginButton =
    document.getElementById("admin-login-btn");

  message.textContent = "";

  if (!email || !password) {
    message.textContent =
      "⚠️ Email dan password harus diisi.";
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "⏳ Masuk...";

  const { data, error } =
    await db.auth.signInWithPassword({
      email,
      password
    });

  loginButton.disabled = false;
  loginButton.textContent = "Masuk";

  if (error) {
    message.textContent =
      "❌ Login gagal: " + error.message;
    return;
  }

  if (!data.user) {
    message.textContent =
      "❌ Login gagal.";
    return;
  }

  message.textContent =
    "✅ Login berhasil.";

  document.getElementById("admin-password").value = "";

  setTimeout(() => {
    tutupAdmin();
  }, 800);
}


document
.getElementById("adminModal")
.addEventListener(
  "click",
  function(e){

    if(e.target === this){
      tutupAdmin();
    }

  }
);

</script>

    async function tampilkanBuku() {
  const { data, error } = await db
    .from("books")
    .select("*")
    .order("title", { ascending: true });

  const bookList = document.getElementById("bookList");

  if (error) {
    console.error("Gagal mengambil buku:", error);
    bookList.innerHTML = "<p>Gagal memuat koleksi buku.</p>";
    return;
  }

  if (!data || data.length === 0) {
    bookList.innerHTML = "<p>Belum ada buku.</p>";
    return;
  }

  bookList.innerHTML = "";

  data.forEach((buku) => {
    const card = document.createElement("div");
    card.className = "book-card";

    card.innerHTML = `
    ${buku.cover_url ? `<img class="book-cover" src="${buku.cover_url}" alt="Cover ${buku.title || 'Buku'}">` : ""}
    <div class="book-info">
      <h3>${buku.title || "Tanpa Judul"}</h3>
      <p>Penulis: ${buku.author || "-"}</p>
      <p>Kategori: ${buku.category || "-"}</p>
      <p>${buku.description || ""}</p>
      ${buku.file_url ? `<a class="read-button" href="reader.html?file=${encodeURIComponent(buku.file_url)}">📖 Baca Buku</a>` : ""}
      </div>
    `;

    bookList.appendChild(card);
  });
}

tampilkanBuku();
    </script>

</body>
</html>
