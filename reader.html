<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reader | Perpustakaan Nawir Pakaja</title>

  <style>
    *{
      box-sizing:border-box;
    }
    
/* =========================================
   READER THEME ENGINE
   ========================================= */
    
:root{
  --reader-bg:#f4f7fb;
  --reader-surface:#ffffff;
  --reader-surface-2:#f8fafc;
  --reader-text:#172033;
  --reader-muted:#667085;
  --reader-border:#e4e7ec;
  --reader-primary:#2563eb;
}

body.dark{
  --reader-bg:#111827;
  --reader-surface:#0f172a;
  --reader-surface-2:#1f2937;
  --reader-text:#ffffff;
  --reader-muted:#cbd5e1;
  --reader-border:#334155;
  --reader-primary:#2563eb;
}
  
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--reader-bg);
  color:var(--reader-text);
}
   
.reader-header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#0f172a;
  border-bottom:1px solid #334155;
}
    
.reader-header h2{
  margin:0;
  font-size:18px;
}
    
.back-button{
  color:white;
  text-decoration:none;
  background:#2563eb;
  padding:9px 14px;
  border-radius:8px;
}
    
.reader-header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
    
#reader-login-button,
#reader-logout-button{
  border:0;
  border-radius:8px;
  padding:9px 12px;
  cursor:pointer;
  background:#334155;
  color:white;
}
    
#reader-user-status{
  font-size:12px;
  color:#cbd5e1;
}
    
#reader-login-modal{
  position:fixed;
  inset:0;
  z-index:20000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);
}
    
.reader-login-box{
  width:100%;
  max-width:360px;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:20px;
  border-radius:14px;
  background:#0f172a;
  color:white;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
    
.reader-login-box h3{
  margin:0 0 4px;
  text-align:center;
}
    
.reader-login-box input{
  width:100%;
  padding:11px 12px;
  border:1px solid #475569;
  border-radius:8px;
  outline:none;
  background:#f8fafc;
  color:#111827;
}
    
.reader-login-box button{
  padding:10px 12px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}
    
#reader-login-submit{
  background:#2563eb;
  color:white;
  font-weight:700;
}
    
#reader-login-cancel{
  background:#334155;
  color:white;
}
    
#reader-login-message{
  min-height:18px;
  font-size:12px;
  text-align:center;
  color:#fca5a5;
}
    
.reader-area{
  min-height:calc(100vh - 60px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:20px;
}
    
.book{
  width:90%;
  max-width:1000px;
  min-height:600px;
  background:white;
  color:#111827;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
  justify-content:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
    
.book p{
  font-size:22px;
}
    
.page-controls{
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;

  display:flex;
  align-items:center;
  gap:12px;

  padding:10px 14px;
  background:#0f172a;
  color:white;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  white-space:nowrap;
}
    
.page-controls button{
  padding:8px 12px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}
    
#toolbar-toggle{
  position:fixed;
  top:70px;
  right:10px;
  z-index:10000;
  border:0;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  font-size:18px;
  background:#0f172a;
  color:white;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
    
#brightness-panel{
  position:fixed;
  top:120px;
  right:10px;
  z-index:10000;
  display:none;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:#0f172a;
  color:white;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
    
#brightness-slider{
  width:130px;
  cursor:pointer;
}
    
#brightness-value{
  min-width:42px;
  font-size:12px;
  text-align:right;
}
    
#contrast-panel{
  position:fixed;
  top:170px;
  right:10px;
  z-index:10000;
  display:none;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:#0f172a;
  color:white;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
    
#contrast-slider{
  width:130px;
  cursor:pointer;
}
    
#contrast-value{
  min-width:42px;
  font-size:12px;
  text-align:right;
}
    
#preset-panel{
  position:fixed;
  top:80px;
  right:10px;
  z-index:10000;
  display:none;
  flex-direction:column;
  gap:8px;
  padding:10px;
  background:#0f172a;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  max-height:calc(100vh - 160px);
  overflow-y:auto;
}
    
#preset-panel button{
  padding:9px 12px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  text-align:left;
  white-space:nowrap;
}
    
#preset-panel button:disabled{
  opacity:0.4;
  cursor:not-allowed;
  filter:grayscale(1);
}
    
#preset-close{
  position:sticky;
  top:0;
  z-index:2;
  background:#334155;
  color:white;
  font-weight:700;
  text-align:center;
}
    
#preset-name,
#preset-list{
  width:100%;
  box-sizing:border-box;
  padding:9px 10px;
  border:0;
  border-radius:8px;
  outline:none;
}
    
#preset-count{
  color:white;
  font-size:13px;
  font-weight:700;
  text-align:center;
  padding:4px 6px;
}
    
#preset-default-badge{
  color:#facc15;
  background:rgba(250,204,21,.12);
  border:1px solid rgba(250,204,21,.35);
  border-radius:8px;
  padding:7px 9px;
  font-size:12px;
  font-weight:700;
  text-align:center;
}
    
#preset-active-badge{
  color:#86efac;
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.35);
  border-radius:8px;
  padding:7px 9px;
  font-size:12px;
  font-weight:700;
  text-align:center;
}
    
#preset-summary{
  color:#e2e8f0;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  line-height:1.5;
}
    
#preset-name{
  background:#ffffff;
}
    
#preset-list{
  background:#f8fafc;
  cursor:pointer;
}
    
.page-controls{
  transition:opacity .25s ease, transform .25s ease;
}
    
.page-controls.toolbar-hidden{
  opacity:0;
  pointer-events:none;
  transform:translateX(-50%) translateY(20px);
}
    
.page-container{
  perspective:1800px;
}
    
#pdf-page{
  transform-style:preserve-3d;
  backface-visibility:hidden;
}
    
#pdf-page.flip-next{
  transform-origin:left center;
  box-shadow:18px 0 28px rgba(0,0,0,.28);
  animation:flipNext .8s cubic-bezier(.55,.05,.45,.95);
}
    
#pdf-page.flip-prev{
  transform-origin:right center;
  box-shadow:-18px 0 28px rgba(0,0,0,.28);
  animation:flipPrev .8s cubic-bezier(.55,.05,.45,.95);
}
    
@keyframes flipNext{
  0%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }

  49%{
    transform:rotateY(-89deg) scale(.92);
    opacity:.35;
  }

  50%{
    transform:rotateY(89deg) scale(.92);
    opacity:.35;
  }

  100%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }
}
    
@keyframes flipPrev{
  0%{
    transform:rotateY(0deg) scale(1);
  opacity:1;
  }

  49%{
    transform:rotateY(89deg) scale(.92);
    opacity:.35;
  }

  50%{
    transform:rotateY(-89deg) scale(.92);
    opacity:.35;
  }

  100%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }
}
    
 #opening-screen{
   position:fixed;
   inset:0;
   background:rgba(15,23,42,.96);
   display:flex;
   align-items:center;
   justify-content:center;
   z-index:10000;
 }
    
#open-book{
  font-size:22px;
  padding:16px 28px;
  border:0;
  border-radius:14px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
    
@media (max-width:600px){
  #reading-progress{
    top:54px;
  }
  
#toolbar-toggle{
  top:64px;
}
  
.reader-header{
  min-height:54px;
  height:auto;
  width:100%;
  max-width:100vw;
  padding:7px 10px;
  gap:8px;
  overflow:hidden;
}
  
.reader-header h2{
  flex:1 1 auto;
  min-width:0;
  font-size:14px;
  line-height:1.15;
}
  
.reader-header-actions{
  flex:0 0 auto;
  min-width:0;
  max-width:55%;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
}
  
#reader-user-status{
  display:none;
}
  
#reader-login-button,
#reader-logout-button,
.back-button{
  padding:7px 8px;
  font-size:11px;
  white-space:nowrap;
}
  
.reader-area{
  padding:10px 6px 140px;
}
  
.book{
  width:100%;
  min-height:0;
  border-radius:10px;
  gap:10px;
}
  
.page-controls{
  top:auto;
  bottom:12px;
  width:calc(100% - 32px);
  max-width:calc(100vw - 32px);
  padding:7px 6px;
  gap:4px;
  justify-content:center;
  border-radius:12px;
  flex-wrap:wrap;
  white-space:normal;
}
  
.page-controls button{
  padding:7px 6px;
  font-size:10px;
  line-height:1;
  min-width:0;
}
  
.page-controls span{
  font-size:10px;
  line-height:1.2;
}
  
#page-flip{
  width:100%;
  display:flex;
  justify-content:center;
}     
  
#open-book{
  font-size:18px;
  padding:14px 22px;
  }
}
    
#page-flip{
  --reader-brightness:1;
  --reader-contrast:1;
  transition:filter .3s ease;
  filter:
  brightness(var(--reader-brightness))
  contrast(var(--reader-contrast));
}
    
#page-flip.mode-sepia{
  filter:
    sepia(.35)
    brightness(.95)
    brightness(var(--reader-brightness))
    contrast(.95)
    contrast(var(--reader-contrast));
}
    
#page-flip.mode-night{
  filter:
    invert(.88)
    hue-rotate(180deg)
    brightness(.82)
    brightness(var(--reader-brightness))
    contrast(.9)
    contrast(var(--reader-contrast));
}
    
#reading-progress{
  position:fixed;
  top:60px;
  left:0;
  width:100%;
  height:4px;
  background:rgba(255,255,255,.12);
  z-index:9998;
}
    
#reading-progress-bar{
  width:0%;
  height:100%;
  background:#2563eb;
  transition:width .35s ease;
}
    
#bookmark-panel{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10001;
  padding:20px;
}
    
.bookmark-panel-box{
  width:min(420px,100%);
  max-height:70vh;
  overflow:auto;
  background:white;
  color:#111827;
  border-radius:16px;
  padding:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
    
.bookmark-panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
    
#close-bookmarks{
  border:0;
  background:#e5e7eb;
  border-radius:8px;
  padding:6px 10px;
  cursor:pointer;
}
    
#bookmark-search{
  width:100%;
  margin-bottom:12px;
  padding:10px 12px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:14px;
  outline:none;
}
    
#bookmark-search:focus{
  border-color:#2563eb;
}  
    
#favorite-filter{
  width:100%;
  margin-bottom:12px;
  padding:9px 12px;
  border:0;
  border-radius:10px;
  background:#e5e7eb;
  cursor:pointer;
  font-size:14px;
}
    
/* =========================================
   READER BOOKMARK RESET FILTER
   ========================================= */

#bookmark-reset-filter{
  width:100%;
  margin-bottom:12px;
  padding:9px 12px;

  border:
    1px solid var(--reader-border);

  border-radius:10px;

  background:
    var(--reader-surface-2);

  color:
    var(--reader-text);

  cursor:pointer;
  font-size:14px;
  font-weight:600;
}
    
#bookmark-reset-filter:hover{
  filter:brightness(1.05);
}
    
/* =========================================
   BOOKMARK FILTER STATUS
   ========================================= */

#bookmark-filter-status{
  width:100%;

  margin:
    -2px 0 12px;

  padding:
    8px 10px;

  background:
    var(--reader-surface-2);

  color:
    var(--reader-muted);

  border:
    1px solid var(--reader-border);

  border-radius:10px;

  font-size:12px;
  font-weight:600;

  text-align:center;
}
    
  #bookmark-sort{
  width:100%;
  margin-bottom:12px;
  padding:9px 12px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:white;
  font-size:14px;
  cursor:pointer;
}
    
#favorite-filter.active{
  background:#fef3c7;
  font-weight:600;
}
    
#bookmark-items button{
  margin:0;
  padding:10px 12px;
  border:0;
  border-radius:10px;
  background:#f1f5f9;
  cursor:pointer;
  text-align:left;
}
    
.bookmark-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:5px 0;
}
    
/* =========================================
   CURRENT BOOKMARK ROW HIGHLIGHT
   ========================================= */

.bookmark-row.current-page{
  padding:6px;
  border-radius:12px;

  background:
  rgba(245, 158, 11, 0.12);

  outline:
  2px solid rgba(245, 158, 11, 0.55);
}
    
body.dark .bookmark-row.current-page{
  background:
    rgba(251, 191, 36, 0.10);

  outline:
    2px solid rgba(251, 191, 36, 0.50);
}
    
.bookmark-row > button:first-child{
  flex:1;
  width:0;
  min-width:0;
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
    
.bookmark-row .bookmark-delete{
  width:auto;
  flex:0 0 auto;
  margin:0;
  padding:10px 12px;
  background:#fee2e2;
}
    
.bookmark-row .bookmark-favorite{
  width:auto;
  flex:0 0 auto;
  margin:0;
  padding:10px 12px;
  background:#fef9c3;
}
    
.bookmark-row .bookmark-edit{
  width:auto;
  flex:0 0 auto;
  margin:0;
  padding:10px 12px;
  background:#fef3c7;
}
    
    .label-short{
  display:none;
}
    
@media (max-width:600px) and (orientation:portrait){
  .label-long{
    display:none;
  }
  
  .label-short{
    display:inline;
  }
}
    
/* =========================================
   READER UI BASE THEME
   ========================================= */

.reader-header{
  background:var(--reader-surface);
  color:var(--reader-text);
  border-bottom:1px solid var(--reader-border);
}
    
/* Toolbar utama */
.page-controls{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}
    
/* Hamburger */
#toolbar-toggle{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}
    
/* Panel Brightness */
#brightness-panel{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}
    
/* Panel Contrast */
#contrast-panel{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}
    
/* Panel Preset */
#preset-panel{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}
    
/* Tombol umum Reader */
.back-button,
#reader-login-button,
#reader-logout-button,
.reader-login-box button,
.page-controls button,
#preset-panel button,
#bookmark-items button{
  background:var(--reader-surface-2);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}
    
/* =========================================
   BOOKMARK LIST BUTTON HIGHLIGHT
   ========================================= */

#bookmark-list{
  font-size:18px;
  font-weight:700;

  background:#2563eb;
  color:#ffffff;

  border:
    1px solid #1d4ed8;

  box-shadow:
    0 6px 16px rgba(37, 99, 235, 0.28);

  text-shadow:
    0 1px 1px rgba(0, 0, 0, 0.18);
}
    
#bookmark-list:hover{
  filter:brightness(1.06);
}
    
#bookmark-list:active{
  transform:translateY(1px);
}
    
body.dark #bookmark-list{
  background:#3b82f6;
  color:#ffffff;

  border:
    1px solid #60a5fa;

  box-shadow:
    0 6px 18px rgba(59, 130, 246, 0.30);
}
    
/* =========================================
   CURRENT PAGE BOOKMARK STATUS
   ========================================= */

#bookmark-page.bookmarked{
  background:#f59e0b;
  color:#111827;

  border:
    1px solid #d97706;

  box-shadow:
    0 6px 16px rgba(245, 158, 11, 0.30);

  font-weight:700;
}
    
body.dark #bookmark-page.bookmarked{
  background:#fbbf24;
  color:#111827;

  border:
    1px solid #f59e0b;

  box-shadow:
    0 6px 18px rgba(251, 191, 36, 0.28);
}
    
/* Input dan pilihan di panel */
#preset-panel input,
#preset-panel select,
.reader-login-box input{
  background:var(--reader-surface-2);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}
    
/* Login box */
.reader-login-box{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}
    
/* Transisi Light/Dark */
.reader-header,
.page-controls,
#toolbar-toggle,
#brightness-panel,
#contrast-panel,
#preset-panel,
.reader-login-box,
.back-button,
#reader-login-button,
#reader-logout-button,
.page-controls button,
#preset-panel button{
  transition:
    background .3s ease,
    color .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}
    
/* =========================================
   READER BOOKMARK BASE THEME
   ========================================= */

/* Light */
body:not(.dark) .bookmark-panel-box{
  background:#ffffff;
  color:#172033;

  border:
    1px solid #e4e7ec;

  box-shadow:
    0 20px 60px rgba(15, 23, 42, 0.18);
}
    
body:not(.dark) #bookmark-search,
body:not(.dark) #bookmark-sort,
body:not(.dark) #favorite-filter,
body:not(.dark) #bookmark-reset-filter,
body:not(.dark) #close-bookmarks,
body:not(.dark) #bookmark-items button{
  background:#f8fafc;
  color:#172033;

  border:
    1px solid #e4e7ec;
}
    
/* Dark */
body.dark .bookmark-panel-box{
  background:#0f172a;
  color:#f8fafc;

  border:
    1px solid #334155;

  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.48);
}
    
body.dark #bookmark-search,
body.dark #bookmark-sort,
body.dark #favorite-filter,
body.dark #bookmark-reset-filter,
body.dark #close-bookmarks,
body.dark #bookmark-items button{
  background:#1f2937;
  color:#f8fafc;

  border:
    1px solid #334155;
}
    
/* Delete */
.bookmark-row .bookmark-delete{
  background:#fee2e2 !important;
  color:#991b1b !important;
}
    
body.dark .bookmark-row .bookmark-delete{
  background:#450a0a !important;
  color:#fecaca !important;
}
    
/* Favorite */
.bookmark-row .bookmark-favorite{
  background:#fef9c3 !important;
  color:#854d0e !important;
}
    
body.dark .bookmark-row .bookmark-favorite{
  background:#422006 !important;
  color:#fde68a !important;
}
    
/* Edit */
.bookmark-row .bookmark-edit{

/* =========================================
   READER CUSTOM DIALOG BASE THEME
   ========================================= */

#reader-dialog{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(15,23,42,.72);

  z-index:15000;
}
    
/* Saat dialog dibuka */
#reader-dialog.show{
  display:flex;
}
    
/* Kotak dialog */
.reader-dialog-box{
  width:min(420px,100%);

  background:var(--reader-surface);
  color:var(--reader-text);

  border:
    1px solid var(--reader-border);

  border-radius:18px;

  padding:18px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.32);
}
    
/* Header */
.reader-dialog-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:14px;
}
    
#reader-dialog-title{
  font-size:16px;
}
    
/* Tombol X */
#reader-dialog-close{
  flex:0 0 auto;

  padding:7px 10px;

  background:var(--reader-surface-2);
  color:var(--reader-text);

  border:
    1px solid var(--reader-border);

  border-radius:9px;

  cursor:pointer;
}
    
/* Pesan */
.reader-dialog-message{
  margin-bottom:12px;

  color:var(--reader-muted);

  font-size:14px;
  line-height:1.5;
}
    
/* Input */
#reader-dialog-input{
  width:100%;

  padding:11px 12px;

  background:var(--reader-surface-2);
  color:var(--reader-text);

  border:
    1px solid var(--reader-border);

  border-radius:10px;

  outline:none;

  font-size:15px;
}
    
#reader-dialog-input:focus{
  border-color:var(--reader-primary);

  box-shadow:
    0 0 0 3px rgba(37,99,235,.12);
}
    
/* Error */
.reader-dialog-error{
  min-height:18px;

  margin-top:7px;

  color:#ef4444;

  font-size:12px;
}
    
/* Tombol bawah */
.reader-dialog-actions{
  display:flex;

  gap:10px;

  margin-top:12px;
}
    
#reader-dialog-cancel,
#reader-dialog-confirm{
  flex:1;

  padding:10px 12px;

  border-radius:10px;

  cursor:pointer;
}
    
#reader-dialog-cancel{
  background:var(--reader-surface-2);
  color:var(--reader-text);

  border:
    1px solid var(--reader-border);
}
    
#reader-dialog-confirm{
  background:var(--reader-primary);
  color:white;

  border:
    1px solid var(--reader-primary);

  font-weight:700;
}
    
/* Transisi */
.reader-dialog-box,
#reader-dialog-close,
#reader-dialog-input,
#reader-dialog-cancel,
#reader-dialog-confirm{
  transition:
    background .3s ease,
    color .3s ease,
    border-color .3s ease,
    box-shadow .3s ease,
    transform .15s ease;
}
    
/* HP */
@media (max-width:600px){
  
  #reader-dialog{
    padding:16px;
  }
  
  .reader-dialog-box{
    width:100%;
    max-width:360px;

    padding:16px;

    border-radius:16px;
  }
}

async function renderPDFPages() {

    );

    return [];

  const totalPages =
    Number(
      pdfDoc.numPages

  if (
    !Number.isInteger(
      totalPages

    logWarn(
      "Jumlah halaman PDF tidak valid:",

  if (

  const images =

  try {

    for (
      let num = 1;
      num <= totalPages;

        page =
          await pdfDoc.getPage(
            num

        if (
          !page ||
          typeof page.getViewport !==
            "function" ||
          typeof page.render !==
            "function"
        ) {

          throw new Error(
            `Halaman PDF ${num} tidak valid.`
          );
        }

        const viewport =
          page.getViewport({

        if (
          !viewport ||

          !Number.isFinite(
            Number(

          Number(

          Number(

          typeof canvas.getContext !==

          typeof canvas.toDataURL !==
            "function"
        ) {

          throw new Error(
            `Canvas halaman PDF ${num} tidak tersedia.`
          );
        }

        const context =
          canvas.getContext(
            "2d"
          );

        if (
          !context
        ) {

          throw new Error(
            `Context 2D halaman PDF ${num} tidak tersedia.`
          );
        }

        canvas.width =
          Math.ceil(
            Number(
              viewport.width
            )
          );

        canvas.height =
          Math.ceil(
            Number(
              viewport.height
            )
          );

        const renderTask =
          page.render({
            canvasContext:
              context,

            viewport:
              viewport
          });

        if (
          !renderTask ||
          !renderTask.promise ||
          typeof renderTask.promise.then !==
            "function"
        ) {

          throw new Error(
            `Render task halaman PDF ${num} tidak valid.`
          );
        }

        await renderTask.promise;

        const imageData =
          canvas.toDataURL(
            "image/jpeg",
            0.92

        if (

            "string" ||
          !imageData.startsWith(
            "data:image/jpeg"

        ) {

            `Hasil render halaman PDF ${num} tidak valid.`
          );
        }

        images.push(

        pageError

        logError(

        );

        return [];

      } finally {

        if (

  ) {

          totalPages,
        actual:
          images.length
      }

    return [];
  }

}

function applySavedBrightness() {

  const logWarn = (...args) => {
    if (
      typeof console !== "undefined" &&
      console &&
      typeof console.warn === "function"
    ) {
      console.warn(...args);
    }
  };

  const rawBrightness =
    typeof brightnessLevel !== "undefined"
      ? brightnessLevel
      : undefined;

  const brightnessValue = Number(rawBrightness);

  if (
    !Number.isFinite(brightnessValue) ||
    brightnessValue < 50 ||
    brightnessValue > 130
  ) {
    logWarn(
      "brightnessLevel Reader tidak valid:",
      rawBrightness
    );
    return false;
  }

  const normalizedBrightness = Math.round(brightnessValue);

  if (
    typeof document === "undefined" ||
    !document ||
    typeof document.getElementById !== "function"
  ) {
    logWarn(
      "Document tidak tersedia untuk menerapkan brightness Reader."
    );
    return false;
  }

  let slider = null;
  let valueLabel = null;
  let page = null;

  try {
    slider = document.getElementById("brightness-slider");
    valueLabel = document.getElementById("brightness-value");
    page = document.getElementById("page-flip");
  } catch (elementLookupError) {
    logWarn(
      "Elemen Reader gagal diperiksa untuk menerapkan brightness:",
      elementLookupError
    );
    return false;
  }

  if (!slider) {
    logWarn("Slider brightness Reader tidak ditemukan.");
    return false;
  }

  if (!valueLabel) {
    logWarn("Label brightness Reader tidak ditemukan.");
    return false;
  }

  if (
    !page ||
    !page.style ||
    typeof page.style.setProperty !== "function"
  ) {
    logWarn(
      "Elemen page-flip Reader tidak tersedia untuk menerapkan brightness."
    );
    return false;
  }

  const previousBrightnessState = brightnessLevel;
  let previousSliderValue = "";
  let previousLabelText = "";
  let previousCssValue = "";
  let previousCssValueAvailable = false;

  try {
    previousSliderValue = slider.value;
    previousLabelText = valueLabel.textContent;

    if (typeof page.style.getPropertyValue === "function") {
      previousCssValue = page.style.getPropertyValue(
        "--reader-brightness"
      );
      previousCssValueAvailable = true;
    }
  } catch (snapshotError) {
    logWarn(
      "State tampilan Brightness sebelumnya gagal dibaca:",
      snapshotError
    );
    return false;
  }

  try {
    slider.value = String(normalizedBrightness);

    if (Number(slider.value) !== normalizedBrightness) {
      throw new Error(
        "Nilai slider brightness tidak sesuai dengan nilai normalisasi."
      );
    }

    valueLabel.textContent = normalizedBrightness + "%";

    page.style.setProperty(
      "--reader-brightness",
      String(normalizedBrightness / 100)
    );

    brightnessLevel = normalizedBrightness;
  } catch (applyError) {
    try {
      slider.value = previousSliderValue;
      valueLabel.textContent = previousLabelText;

      if (previousCssValueAvailable) {
        if (previousCssValue) {
          page.style.setProperty(
            "--reader-brightness",
            previousCssValue
          );
        } else if (typeof page.style.removeProperty === "function") {
          page.style.removeProperty("--reader-brightness");
        }
      }

      brightnessLevel = previousBrightnessState;
    } catch (rollbackError) {
      logWarn(
        "Pemulihan tampilan Brightness setelah gagal menerapkan nilai baru juga gagal:",
        rollbackError
      );
    }

    logWarn(
      "Brightness Reader gagal diterapkan:",
      applyError
    );
    return false;
  }

  if (brightnessValue !== normalizedBrightness) {
    try {
      const storageSiap =
        typeof localStorage !== "undefined" &&
        Boolean(localStorage) &&
        typeof localStorage.setItem === "function";

      const storageKey =
        typeof brightnessKey === "string"
          ? brightnessKey.trim()
          : "";

      if (storageSiap && storageKey) {
        localStorage.setItem(
          storageKey,
          String(normalizedBrightness)
        );
      } else {
        logWarn(
          "Normalisasi Brightness berhasil diterapkan, tetapi localStorage atau brightnessKey tidak tersedia untuk menyimpan nilai integer."
        );
      }
    } catch (storageError) {
      logWarn(
        "Normalisasi Brightness berhasil diterapkan, tetapi gagal disimpan ke localStorage:",
        storageError
      );
    }
  }

  return true;
}

  ) {

    );

    return false;
  }

  let page;
  let button;
  let previousSepia;
  let previousNight;

      !document ||
      typeof document.getElementById !== "function"
    ) {

        "Document tidak tersedia untuk menerapkan mode baca Reader."

      return false;

    page = document.getElementById("page-flip");

    if (
      !page ||
      !page.classList ||
      typeof page.classList.contains !== "function" ||
      typeof page.classList.toggle !== "function" ||
      !button
    ) {
      logWarn(
        "Elemen page-flip atau tombol reading-mode Reader tidak tersedia atau tidak valid."
      );

      return false;
    }

    previousSepia = page.classList.contains("mode-sepia");
    previousNight = page.classList.contains("mode-night");
    previousText = button.textContent;
    previousTitle = button.title;

    logWarn(
      "Persiapan penerapan mode baca Reader gagal:",

    return false;
