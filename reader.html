#pdf-page{

#pdf-page.flip-next{

  box-shadow:18px 0 28px rgba(0,0,0,.28);

}

#pdf-page.flip-prev{
  transform-origin:right center;
  box-shadow:-18px 0 28px rgba(0,0,0,.28);
  animation:flipPrev .8s cubic-bezier(.55,.05,.45,.95);
}

@keyframes flipNext{
  0%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }

  49%{
    transform:rotateY(-89deg) scale(.92);
    opacity:.35;
  }

  50%{
    transform:rotateY(89deg) scale(.92);
    opacity:.35;
  }

  100%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }
}

    @keyframes flipPrev{

    transform:rotateY(0deg) scale(1);
    opacity:1;

  }

  50%{

  }

  100%{

  }

<script>
  const SUPABASE_URL =
  "https://lacdmofkvrmygwczoeux.supabase.co";

const SUPABASE_KEY =

const db =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginModal =
  document.getElementById("reader-login-modal");

const loginButton =
  document.getElementById("reader-login-button");

const logoutButton =
  document.getElementById("reader-logout-button");

const userStatus =
  document.getElementById("reader-user-status");

const loginEmail =
  document.getElementById("reader-login-email");

const loginPassword =
  document.getElementById("reader-login-password");

const loginMessage =
  document.getElementById("reader-login-message");

const loginSubmit =
  document.getElementById("reader-login-submit");

const loginCancel =
  document.getElementById("reader-login-cancel");

async function updateReaderAuthUI() {
  const {
    data: { session }
  } = await db.auth.getSession();

  const user = session?.user;

  if (user) {
    userStatus.textContent =
      "✅ " + user.email;

    loginButton.hidden = true;
    logoutButton.hidden = false;

    await loadPresetsFromCloud();
  } else {
    userStatus.textContent = "Belum login";

    loginButton.hidden = false;
    logoutButton.hidden = true;
  }
}

loginButton.addEventListener("click", () => {
  loginMessage.textContent = "";
  loginModal.style.display = "flex";
});

loginCancel.addEventListener("click", () => {
  loginModal.style.display = "none";
});

loginSubmit.addEventListener("click", async () => {
  const email = loginEmail.value.trim();
  const password = loginPassword.value;

  if (!email || !password) {
    loginMessage.textContent =
      "Email dan password harus diisi.";
    return;
  }

  loginSubmit.disabled = true;
  loginSubmit.textContent = "⏳ Masuk...";

  const { error } =
    await db.auth.signInWithPassword({
      email,
      password
    });

  loginSubmit.disabled = false;
  loginSubmit.textContent = "🔐 Masuk";

  if (error) {
    loginMessage.textContent =
      "Login gagal: " + error.message;
    return;
  }

  loginPassword.value = "";
  loginModal.style.display = "none";

  await updateReaderAuthUI();
});

logoutButton.addEventListener("click", async () => {
  await db.auth.signOut();
  await updateReaderAuthUI();
});

db.auth.onAuthStateChange(() => {
  updateReaderAuthUI();
});

updateReaderAuthUI();

  async function renderPDFPages() {
  const images = [];

  for (let num = 1; num <= pdfDoc.numPages; num++) {
    const page = await pdfDoc.getPage(num);

    const viewport = page.getViewport({ scale: 1.4 });

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    images.push(canvas.toDataURL("image/jpeg", 0.92));
  }

  return images;
}

async function savePresetsToCloud() {
  const {
    data: { user },
    error: userError
  } = await db.auth.getUser();

  if (userError || !user) {
    return;
  }

  const { error } = await db
    .from("reader_presets")
    .upsert(
      {
        user_id: user.id,
        presets: displayPresets,
        default_preset:
          localStorage.getItem(defaultPresetKey),
        active_preset:
          localStorage.getItem(activePresetKey),
        updated_at: new Date().toISOString()
      },
      {
        onConflict: "user_id"
      }
    );

  if (error) {
    console.error(
      "Gagal menyimpan preset ke cloud:",
      error
    );
  }
}

async function loadPresetsFromCloud() {
  const {
    data: { user },
    error: userError
  } = await db.auth.getUser();

  if (userError || !user) {
    return;
  }

  const { data, error } = await db
    .from("reader_presets")
    .select(
      "presets, default_preset, active_preset"
    )
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    console.error(
      "Gagal mengambil preset dari cloud:",
      error
    );
    return;
  }

  if (data) {
    displayPresets =
      data.presets || {};

    localStorage.setItem(
      presetsKey,
      JSON.stringify(displayPresets)
    );

    if (data.default_preset) {
      localStorage.setItem(
        defaultPresetKey,
        data.default_preset
      );
    } else {
      localStorage.removeItem(defaultPresetKey);
    }

    if (data.active_preset) {
      localStorage.setItem(
        activePresetKey,
        data.active_preset
      );
    } else {
      localStorage.removeItem(activePresetKey);
    }

    refreshPresetList();
    updatePresetSummary();
    updatePresetActionState();

    return;
  }

  const hasLocalPresets =
    Object.keys(displayPresets).length > 0;

  async function toggleFullscreen() {
  const elem = document.documentElement;

  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (elem.requestFullscreen) {
        await elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  } catch (error) {
    console.log("Fullscreen gagal:", error);
  }
}

document.getElementById("preset-export").addEventListener("click", () => {
  const exportButton = document.getElementById("preset-export");
  const originalText = exportButton.textContent;

  const exportData = {
    version: 1,
    presets: displayPresets,
    defaultPreset:
      localStorage.getItem(defaultPresetKey) || null
  };

  const jsonData = JSON.stringify(exportData, null, 2);

  const blob = new Blob(
    [jsonData],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  const now = new Date();

const pad = (number) =>
  String(number).padStart(2, "0");

const dateStamp =
  now.getFullYear() + "-" +
  pad(now.getMonth() + 1) + "-" +
  pad(now.getDate());

const timeStamp =
  pad(now.getHours()) + "-" +
  pad(now.getMinutes());

link.download =
  `reader-presets-${dateStamp}_${timeStamp}.json`;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 1000);

  const exportCount = Object.keys(displayPresets).length;

exportButton.textContent =
  `✅ ${exportCount} Preset Diexport`;

  setTimeout(() => {
    exportButton.textContent = originalText;
  }, 1500);
});

document.getElementById("preset-import").addEventListener("click", () => {
  document.getElementById("preset-import-file").click();
});

document.getElementById("preset-import-file").addEventListener("change", async (e) => {
  const importButton = document.getElementById("preset-import");
  const originalText = importButton.textContent;
  const file = e.target.files[0];

  if (!file) return;

  try {
    const text = await file.text();
    const importData = JSON.parse(text);

    if (
      !importData ||
      typeof importData.presets !== "object" ||
      importData.presets === null
    ) {
      throw new Error("Format preset tidak valid");
    }

    displayPresets = {
      ...displayPresets,
      ...importData.presets
    };

    localStorage.setItem(
      presetsKey,
      JSON.stringify(displayPresets)
    );

    if (
      importData.defaultPreset &&
      displayPresets[importData.defaultPreset]
    ) {
      localStorage.setItem(
        defaultPresetKey,
        importData.defaultPreset
      );
    }

    refreshPresetList();

    const importCount =
  Object.keys(importData.presets).length;

importButton.textContent =
  `✅ ${importCount} Preset Diimport`;
  } catch (error) {
    console.log("Import preset gagal:", error);
    importButton.textContent = "⚠️ File Tidak Valid";
  }

  setTimeout(() => {
    importButton.textContent = originalText;
  }, 1500);

  e.target.value = "";
});

  function applySavedReadingMode() {
  const page = document.getElementById("page-flip");
  const button = document.getElementById("reading-mode");

  page.classList.remove("mode-sepia", "mode-night");

  if (readingMode === 1) {
    page.classList.add("mode-sepia");
    button.textContent = "📜";
    button.title = "Mode Sepia";
  } else if (readingMode === 2) {
    page.classList.add("mode-night");
    button.textContent = "🌙";
    button.title = "Mode Malam";
  } else {
    button.textContent = "☀️";
    button.title = "Mode Normal";
  }
}

applySavedReadingMode();

  zoomLevel = defaultPreset.zoomLevel ?? 1;

  localStorage.setItem(contrastKey, contrastLevel);

  applySavedContrast();

  localStorage.setItem(activePresetKey, defaultPresetName);
refreshPresetList();
}
  
  let toolbarTimer = null;
let toolbarInteractionActive = false;
let sliderDragging = false;

function scheduleToolbarHide() {
  clearTimeout(toolbarTimer);

  if (toolbarInteractionActive || sliderDragging) {
    return;
  }

  toolbarTimer = setTimeout(() => {
    if (toolbarInteractionActive || sliderDragging) {
      return;
    }

    const controls =
      document.querySelector(".page-controls");

    const toggle =
      document.getElementById("toolbar-toggle");

    controls.classList.add("toolbar-hidden");
    toggle.textContent = "☰";

    document.getElementById("preset-panel").style.display =
      "none";
  }, 10000);
}

function pauseToolbarHide() {
  toolbarInteractionActive = true;
  clearTimeout(toolbarTimer);
}

function restartToolbarHide() {
  if (toolbarInteractionActive || sliderDragging) {
    return;
  }

  const controls =
    document.querySelector(".page-controls");

  if (!controls.classList.contains("toolbar-hidden")) {
    scheduleToolbarHide();
  }
}

function endToolbarInteraction() {
  toolbarInteractionActive = false;

  if (!sliderDragging) {
    restartToolbarHide();
  }
}

const toolbarInteractiveAreas = [
  document.querySelector(".page-controls"),
  document.getElementById("brightness-panel"),
  document.getElementById("contrast-panel"),
  document.getElementById("preset-panel")
];

toolbarInteractiveAreas.forEach((area) => {
  area.addEventListener("pointerdown", () => {
    pauseToolbarHide();
  });

  area.addEventListener("input", restartToolbarHide);
  area.addEventListener("change", restartToolbarHide);

  area.addEventListener("keydown", pauseToolbarHide);
  area.addEventListener("keyup", endToolbarInteraction);
});

const readerSliders = [
  document.getElementById("brightness-slider"),
  document.getElementById("contrast-slider")
];

function startSliderDrag() {
  sliderDragging = true;
  clearTimeout(toolbarTimer);
}

function endSliderDrag() {
  if (!sliderDragging) return;

  sliderDragging = false;
  toolbarInteractionActive = false;
  scheduleToolbarHide();
}

readerSliders.forEach((slider) => {
  slider.addEventListener("pointerdown", startSliderDrag);
});

document.addEventListener("pointerup", () => {
  endSliderDrag();
  endToolbarInteraction();
});

document.addEventListener("pointercancel", () => {
  endSliderDrag();
  endToolbarInteraction();
});
  
  document.getElementById("toolbar-toggle").addEventListener("click", () => {
  const controls = document.querySelector(".page-controls");
  const toggle = document.getElementById("toolbar-toggle");

  controls.classList.toggle("toolbar-hidden");

  toggle.textContent =
    controls.classList.contains("toolbar-hidden") ? "☰" : "✕";

    if (controls.classList.contains("toolbar-hidden")) {
  clearTimeout(toolbarTimer);
} else {
  scheduleToolbarHide();
}
});

  let lastBookTap = 0;

document.getElementById("flipbook").addEventListener(
  "pointerdown",
  (event) => {
    const controls = document.querySelector(".page-controls");
    const toggle = document.getElementById("toolbar-toggle");

    const now = Date.now();
    const isDoubleTap = now - lastBookTap < 350;
    lastBookTap = now;

    if (isDoubleTap) {
      event.preventDefault();
      event.stopPropagation();

      toggleFullscreen();
      return;
    }

    controls.classList.remove("toolbar-hidden");
    toggle.textContent = "✕";

    scheduleToolbarHide();
  },
  true
);

  const openingScreen = document.getElementById("opening-screen");
  const openBookButton = document.getElementById("open-book");
  const bismillahAudio = document.getElementById("bismillah-audio");

openBookButton.addEventListener("click", async () => {
  try {
    bismillahAudio.currentTime = 0;
    await bismillahAudio.play();
  } catch (error) {
    console.log("Audio pembuka gagal diputar:", error);
  }

  openingScreen.style.display = "none";
  scheduleToolbarHide();
});
