<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reader | Perpustakaan Nawir Pakaja</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#111827;
      color:white;
    }

    .reader-header{
      height:60px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      background:#0f172a;
      border-bottom:1px solid #334155;
    }

    .reader-header h2{
      margin:0;
      font-size:18px;
    }

    .back-button{
      color:white;
      text-decoration:none;
      background:#2563eb;
      padding:9px 14px;
      border-radius:8px;
    }

    .reader-area{
      min-height:calc(100vh - 60px);
      display:flex;
     align-items:flex-start;
      justify-content:center;
      padding:20px;
    }

    .book{
      width:90%;
      max-width:1000px;
      min-height:600px;
      background:white;
      color:#111827;
      border-radius:12px;
      display:flex;
      flex-direction:column;
      gap:16px;
      align-items:center;
      justify-content:center;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }

    .book p{
      font-size:22px;
    }
    .page-controls{
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;

  display:flex;
  align-items:center;
  gap:12px;

  padding:10px 14px;
  background:#0f172a;
  color:white;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  white-space:nowrap;
}

.page-controls button{
  padding:8px 12px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}
    .page-container{
  perspective:1800px;
}

#pdf-page{
  transform-style:preserve-3d;
  backface-visibility:hidden;
}

#pdf-page.flip-next{
  transform-origin:left center;
  box-shadow:18px 0 28px rgba(0,0,0,.28);
  animation:flipNext .8s cubic-bezier(.55,.05,.45,.95);
}

#pdf-page.flip-prev{
  transform-origin:right center;
  box-shadow:-18px 0 28px rgba(0,0,0,.28);
  animation:flipPrev .8s cubic-bezier(.55,.05,.45,.95);
}

@keyframes flipNext{
  0%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }

  49%{
    transform:rotateY(-89deg) scale(.92);
    opacity:.35;
  }

  50%{
    transform:rotateY(89deg) scale(.92);
    opacity:.35;
  }

  100%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }
}

    @keyframes flipPrev{
  0%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }

  49%{
    transform:rotateY(89deg) scale(.92);
    opacity:.35;
  }

  50%{
    transform:rotateY(-89deg) scale(.92);
    opacity:.35;
  }

  100%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }
}
    #opening-screen{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.96);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10000;
}

#open-book{
  font-size:22px;
  padding:16px 28px;
  border:0;
  border-radius:14px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
    @media (max-width:600px){
#reading-progress{
  top:54px;
}
      
  .reader-header{
    height:54px;
    padding:0 10px;
  }

  .reader-header h2{
    font-size:14px;
  }

  .back-button{
    padding:7px 10px;
    font-size:12px;
  }

  .reader-area{
    padding:10px 6px 85px;
  }

  .book{
    width:100%;
    min-height:0;
    border-radius:10px;
    gap:10px;
  }

  .page-controls{
    top:auto;
    bottom:10px;
    width:calc(100% - 16px);
    padding:8px;
    gap:5px;
    justify-content:center;
    border-radius:12px;
  }

  .page-controls button{
    padding:8px 7px;
    font-size:11px;
  }

  .page-controls span{
    font-size:11px;
  }

  #page-flip{
    width:100%;
    display:flex;
    justify-content:center;
  }

  #open-book{
    font-size:18px;
    padding:14px 22px;
  }
}
  #reading-progress{
  position:fixed;
  top:60px;
  left:0;
  width:100%;
  height:4px;
  background:rgba(255,255,255,.12);
  z-index:9998;
}

#reading-progress-bar{
  width:0%;
  height:100%;
  background:#2563eb;
  transition:width .35s ease;
}
    #bookmark-panel{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10001;
  padding:20px;
}

.bookmark-panel-box{
  width:min(420px,100%);
  max-height:70vh;
  overflow:auto;
  background:white;
  color:#111827;
  border-radius:16px;
  padding:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.bookmark-panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

#close-bookmarks{
  border:0;
  background:#e5e7eb;
  border-radius:8px;
  padding:6px 10px;
  cursor:pointer;
}

#bookmark-items button{
  width:100%;
  margin:5px 0;
  padding:10px 12px;
  border:0;
  border-radius:10px;
  background:#f1f5f9;
  cursor:pointer;
  text-align:left;
}
    .label-short{
  display:none;
}

@media (max-width:600px) and (orientation:portrait){
  .label-long{
    display:none;
  }

  .label-short{
    display:inline;
  }
}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>

<body>

  <audio id="bismillah-audio" src="Bismillah_final_natural.m4a" preload="auto"></audio>
  <audio id="page-flip-audio" src="page_flip_paper.m4a" preload="auto"></audio>
  <header class="reader-header">
    <h2>📖 Perpustakaan Nawir Pakaja</h2>

    <a href="index.html" class="back-button">
      ← Kembali
    </a>
  </header>
  <div id="reading-progress">
  <div id="reading-progress-bar"></div>
</div>
  <div id="opening-screen">
  <button id="open-book">📖 Buka Buku</button>
</div>

  <main class="reader-area">
    <div class="book" id="flipbook">

  <div class="page-controls">
    <button id="prev-page">◀ Sebelumnya</button>

    <span>
  <span class="label-long">Halaman</span>
  <span class="label-short">Hlm</span>
  <b id="page-num">1</b> /
  <b id="page-count">0</b>
</span>

    <button id="next-page">Berikutnya ▶</button>
    <button id="sound-toggle">🔊 Sound ON</button>
    <button id="go-page" title="Lompat ke halaman">🔢</button>
    <button id="bookmark-page" title="Bookmark halaman">🔖</button>
    <button id="bookmark-list" title="Daftar bookmark">📑</button>
  </div>

  <div id="page-flip"></div>
<div id="bookmark-panel">
  <div class="bookmark-panel-box">
    <div class="bookmark-panel-header">
      <strong>📑 Daftar Bookmark</strong>
      <button id="close-bookmarks">✕</button>
    </div>

    <div id="bookmark-items"></div>
  </div>
</div>
</div>
  </main>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const params = new URLSearchParams(window.location.search);
  const pdfUrl = params.get("file");

  const readingKey = "lastPage:" + encodeURIComponent(pdfUrl || "");
  const bookmarkKey = "bookmarks:" + encodeURIComponent(pdfUrl || "");
let bookmarks = JSON.parse(localStorage.getItem(bookmarkKey) || "[]");
const savedPage = parseInt(localStorage.getItem(readingKey), 10) || 1;
  let soundEnabled = true;
let audioCtx = null;

  let pdfDoc = null;
  let pageNum = savedPage;
function playPageFlipSound() {
  if (!soundEnabled) return;

  const flipAudio = document.getElementById("page-flip-audio");

  flipAudio.currentTime = 0;
  flipAudio.volume = 0.45;

  flipAudio.play().catch((error) => {
    console.log("Suara kertas gagal diputar:", error);
  });
}

  async function renderPDFPages() {
  const images = [];

  for (let num = 1; num <= pdfDoc.numPages; num++) {
    const page = await pdfDoc.getPage(num);

    const viewport = page.getViewport({ scale: 1.4 });

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    images.push(canvas.toDataURL("image/jpeg", 0.92));
  }

  return images;
}
  let pageFlip = null;

async function loadPDF() {
  if (!pdfUrl) {
    alert("File PDF tidak ditemukan.");
    return;
  }

  pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;

  document.getElementById("page-count").textContent = pdfDoc.numPages;
  document.getElementById("reading-progress-bar").style.width =
  (1 / pdfDoc.numPages) * 100 + "%";

  const firstPage = await pdfDoc.getPage(1);
  const firstViewport = firstPage.getViewport({ scale: 1 });

  const ratio = firstViewport.height / firstViewport.width;
  const pageWidth = 480;
  const pageHeight = Math.round(pageWidth * ratio);

  const images = await renderPDFPages();

  pageFlip = new St.PageFlip(
    document.getElementById("page-flip"),
    {
      width: pageWidth,
      height: pageHeight,
      startPage: Math.min(
  Math.max(savedPage - 1, 0),
  pdfDoc.numPages - 1
),
      size: "stretch",
      minWidth: 280,
      maxWidth: pageWidth,
      minHeight: Math.round(280 * ratio),
      maxHeight: pageHeight,
      drawShadow: true,
      flippingTime: 900,
      usePortrait: true,
      autoSize: true,
      maxShadowOpacity: 0.5,
      showCover: true,
      mobileScrollSupport: false
    }
  );

  function updateReadingStatus(currentIndex = pageFlip.getCurrentPageIndex()) {
  const orientation = pageFlip.getOrientation();
  const startPage = currentIndex + 1;

  let pageLabel = String(startPage);
  let progressPage = startPage;

  if (orientation === "landscape" && currentIndex > 0) {
    const endPage = Math.min(startPage + 1, pdfDoc.numPages);

    pageLabel =
      startPage === endPage
        ? String(startPage)
        : startPage + "-" + endPage;

    progressPage = endPage;
  }

  pageNum = startPage;

  document.getElementById("page-num").textContent = pageLabel;

  const progress = (progressPage / pdfDoc.numPages) * 100;

  document.getElementById("reading-progress-bar").style.width =
    progress + "%";
}

pageFlip.on("flip", (e) => {
  const currentIndex = Number(e.data);

  pageNum = currentIndex + 1;
  localStorage.setItem(readingKey, pageNum);

  updateReadingStatus(currentIndex);
});

pageFlip.on("changeOrientation", () => {
  updateReadingStatus();
});

pageFlip.on("changeState", (e) => {
  if (e.data === "flipping") {
    playPageFlipSound();
  }
});

pageFlip.on("init", () => {
  updateReadingStatus();
});
  
  pageFlip.loadFromImages(images);
  
}

document.getElementById("prev-page").addEventListener("click", () => {
  if (!pageFlip || pageFlip.getCurrentPageIndex() <= 0) return;
  pageFlip.flipPrev("bottom");
});

document.getElementById("next-page").addEventListener("click", () => {
  if (
    !pageFlip ||
    pageFlip.getCurrentPageIndex() >= pageFlip.getPageCount() - 1
  ) return;

  pageFlip.flipNext("bottom");
});
  document.getElementById("go-page").addEventListener("click", () => {
  if (!pageFlip || !pdfDoc) return;

  const input = prompt(
    "Masukkan nomor halaman (1-" + pdfDoc.numPages + "):",
    pageNum
  );

  if (input === null) return;

  const targetPage = parseInt(input, 10);

  if (
    Number.isNaN(targetPage) ||
    targetPage < 1 ||
    targetPage > pdfDoc.numPages
  ) {
    alert("Nomor halaman harus antara 1 sampai " + pdfDoc.numPages + ".");
    return;
  }

  const targetIndex = targetPage - 1;

  pageFlip.flip(targetIndex, "bottom");
});
  document.getElementById("bookmark-page").addEventListener("click", () => {
  if (!pageFlip || !pdfDoc) return;

  const currentPage = pageNum;

  if (!bookmarks.includes(currentPage)) {
    bookmarks.push(currentPage);
    bookmarks.sort((a, b) => a - b);

    localStorage.setItem(bookmarkKey, JSON.stringify(bookmarks));

    alert("🔖 Halaman " + currentPage + " berhasil di-bookmark.");
  } else {
  bookmarks = bookmarks.filter((halaman) => halaman !== currentPage);

  localStorage.setItem(bookmarkKey, JSON.stringify(bookmarks));

  alert("🗑️ Bookmark halaman " + currentPage + " dihapus.");
}
});
  function tampilkanBookmarks() {
  const panel = document.getElementById("bookmark-panel");
  const items = document.getElementById("bookmark-items");

  items.innerHTML = "";

  if (bookmarks.length === 0) {
    items.innerHTML = "<p>Belum ada bookmark.</p>";
  } else {
    bookmarks.forEach((halaman) => {
      const tombol = document.createElement("button");

      tombol.textContent = "🔖 Halaman " + halaman;

      tombol.addEventListener("click", () => {
        pageFlip.flip(halaman - 1, "bottom");
        panel.style.display = "none";
      });

      items.appendChild(tombol);
    });
  }

  panel.style.display = "flex";
}

document.getElementById("bookmark-list").addEventListener("click", () => {
  tampilkanBookmarks();
});

document.getElementById("close-bookmarks").addEventListener("click", () => {
  document.getElementById("bookmark-panel").style.display = "none";
});
  document.getElementById("sound-toggle").addEventListener("click", () => {
  soundEnabled = !soundEnabled;

  document.getElementById("sound-toggle").textContent =
    soundEnabled ? "🔊 Sound ON" : "🔇 Sound OFF";
});
  const openingScreen = document.getElementById("opening-screen");
const openBookButton = document.getElementById("open-book");
const bismillahAudio = document.getElementById("bismillah-audio");

openBookButton.addEventListener("click", async () => {
  try {
    bismillahAudio.currentTime = 0;
    await bismillahAudio.play();
  } catch (error) {
    console.log("Audio pembuka gagal diputar:", error);
  }

  openingScreen.style.display = "none";
});
  loadPDF();
</script>
</body>
  
</html>
