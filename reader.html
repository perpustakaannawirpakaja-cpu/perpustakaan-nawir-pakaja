<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reader | Perpustakaan Nawir Pakaja</title>

  <style>
    *{
      box-sizing:border-box;
    }

    /* =========================================
       READER THEME ENGINE
       ========================================= */

:root{
  --reader-bg:#f4f7fb;
  --reader-surface:#ffffff;
  --reader-surface-2:#f8fafc;
  --reader-text:#172033;
  --reader-muted:#667085;
  --reader-border:#e4e7ec;
  --reader-primary:#2563eb;
}

body.dark{
  --reader-bg:#111827;
  --reader-surface:#0f172a;
  --reader-surface-2:#1f2937;
  --reader-text:#ffffff;
  --reader-muted:#cbd5e1;
  --reader-border:#334155;
  --reader-primary:#2563eb;
}
    
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--reader-bg);
  color:var(--reader-text);
}

.reader-header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:#0f172a;
  border-bottom:1px solid #334155;
}

.reader-header h2{
  margin:0;
  font-size:18px;
}

.back-button{
  color:white;
  text-decoration:none;
  background:#2563eb;
  padding:9px 14px;
  border-radius:8px;
}

.reader-header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

#reader-login-button,
#reader-logout-button{
  border:0;
  border-radius:8px;
  padding:9px 12px;
  cursor:pointer;
  background:#334155;
  color:white;
}

#reader-user-status{
  font-size:12px;
  color:#cbd5e1;
}

#reader-login-modal{
  position:fixed;
  inset:0;
  z-index:20000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);
}

.reader-login-box{
  width:100%;
  max-width:360px;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:20px;
  border-radius:14px;
  background:#0f172a;
  color:white;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.reader-login-box h3{
  margin:0 0 4px;
  text-align:center;
}

.reader-login-box input{
  width:100%;
  padding:11px 12px;
  border:1px solid #475569;
  border-radius:8px;
  outline:none;
  background:#f8fafc;
  color:#111827;
}

.reader-login-box button{
  padding:10px 12px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

#reader-login-submit{
  background:#2563eb;
  color:white;
  font-weight:700;
}

#reader-login-cancel{
  background:#334155;
  color:white;
}

#reader-login-message{
  min-height:18px;
  font-size:12px;
  text-align:center;
  color:#fca5a5;
}

.reader-area{
  min-height:calc(100vh - 60px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:20px;
}

.book{
  width:90%;
  max-width:1000px;
  min-height:600px;
  background:white;
  color:#111827;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  gap:16px;
  align-items:center;
  justify-content:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.book p{
  font-size:22px;
}
    
.page-controls{
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;

  display:flex;
  align-items:center;
  gap:12px;

  padding:10px 14px;
  background:#0f172a;
  color:white;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  white-space:nowrap;
}

.page-controls button{
  padding:8px 12px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}
#toolbar-toggle{
  position:fixed;
  top:70px;
  right:10px;
  z-index:10000;
  border:0;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  font-size:18px;
  background:#0f172a;
  color:white;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

#brightness-panel{
  position:fixed;
  top:120px;
  right:10px;
  z-index:10000;
  display:none;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:#0f172a;
  color:white;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}

#brightness-slider{
  width:130px;
  cursor:pointer;
}

#brightness-value{
  min-width:42px;
  font-size:12px;
  text-align:right;
}

#contrast-panel{
  position:fixed;
  top:170px;
  right:10px;
  z-index:10000;
  display:none;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:#0f172a;
  color:white;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}

#contrast-slider{
  width:130px;
  cursor:pointer;
}

#contrast-value{
  min-width:42px;
  font-size:12px;
  text-align:right;
}

#preset-panel{
  position:fixed;
  top:80px;
  right:10px;
  z-index:10000;
  display:none;
  flex-direction:column;
  gap:8px;
  padding:10px;
  background:#0f172a;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  max-height:calc(100vh - 160px);
  overflow-y:auto;
}

#preset-panel button{
  padding:9px 12px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  text-align:left;
  white-space:nowrap;
}

#preset-panel button:disabled{
  opacity:0.4;
  cursor:not-allowed;
  filter:grayscale(1);
}

#preset-close{
  position:sticky;
  top:0;
  z-index:2;
  background:#334155;
  color:white;
  font-weight:700;
  text-align:center;
}

#preset-name,
#preset-list{
  width:100%;
  box-sizing:border-box;
  padding:9px 10px;
  border:0;
  border-radius:8px;
  outline:none;
}
#preset-count{
  color:white;
  font-size:13px;
  font-weight:700;
  text-align:center;
  padding:4px 6px;
}

#preset-default-badge{
  color:#facc15;
  background:rgba(250,204,21,.12);
  border:1px solid rgba(250,204,21,.35);
  border-radius:8px;
  padding:7px 9px;
  font-size:12px;
  font-weight:700;
  text-align:center;
}

#preset-active-badge{
  color:#86efac;
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.35);
  border-radius:8px;
  padding:7px 9px;
  font-size:12px;
  font-weight:700;
  text-align:center;
}

#preset-summary{
  color:#e2e8f0;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  line-height:1.5;
}

#preset-name{
  background:#ffffff;
}

#preset-list{
  background:#f8fafc;
  cursor:pointer;
}
    
.page-controls{
  transition:opacity .25s ease, transform .25s ease;
}

.page-controls.toolbar-hidden{
  opacity:0;
  pointer-events:none;
  transform:translateX(-50%) translateY(20px);
}
    
.page-container{
  perspective:1800px;
}

#pdf-page{
  transform-style:preserve-3d;
  backface-visibility:hidden;
}

#pdf-page.flip-next{
  transform-origin:left center;
  box-shadow:18px 0 28px rgba(0,0,0,.28);
  animation:flipNext .8s cubic-bezier(.55,.05,.45,.95);
}

#pdf-page.flip-prev{
  transform-origin:right center;
  box-shadow:-18px 0 28px rgba(0,0,0,.28);
  animation:flipPrev .8s cubic-bezier(.55,.05,.45,.95);
}

@keyframes flipNext{
  0%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }

  49%{
    transform:rotateY(-89deg) scale(.92);
    opacity:.35;
  }

  50%{
    transform:rotateY(89deg) scale(.92);
    opacity:.35;
  }

  100%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }
}

    @keyframes flipPrev{
  0%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }

  49%{
    transform:rotateY(89deg) scale(.92);
    opacity:.35;
  }

  50%{
    transform:rotateY(-89deg) scale(.92);
    opacity:.35;
  }

  100%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }
}
    #opening-screen{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.96);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10000;
}

#open-book{
  font-size:22px;
  padding:16px 28px;
  border:0;
  border-radius:14px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
    @media (max-width:600px){
#reading-progress{
  top:54px;
}

#toolbar-toggle{
  top:64px;
}
      
.reader-header{
  min-height:54px;
  height:auto;
  width:100%;
  max-width:100vw;
  padding:7px 10px;
  gap:8px;
  overflow:hidden;
}

.reader-header h2{
  flex:1 1 auto;
  min-width:0;
  font-size:14px;
  line-height:1.15;
}

.reader-header-actions{
  flex:0 0 auto;
  min-width:0;
  max-width:55%;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
}

#reader-user-status{
  display:none;
}

#reader-login-button,
#reader-logout-button,
.back-button{
  padding:7px 8px;
  font-size:11px;
  white-space:nowrap;
}
  .reader-area{
    padding:10px 6px 140px;
  }

  .book{
    width:100%;
    min-height:0;
    border-radius:10px;
    gap:10px;
  }

  .page-controls{
  top:auto;
  bottom:12px;
  width:calc(100% - 32px);
  max-width:calc(100vw - 32px);
  padding:7px 6px;
  gap:4px;
  justify-content:center;
  border-radius:12px;
  flex-wrap:wrap;
  white-space:normal;
}

  .page-controls button{
  padding:7px 6px;
  font-size:10px;
  line-height:1;
  min-width:0;
}

  .page-controls span{
  font-size:10px;
  line-height:1.2;
}

  #page-flip{
    width:100%;
    display:flex;
    justify-content:center;
  }     
    
  #open-book{
    font-size:18px;
    padding:14px 22px;
  }
}

  #page-flip{
  --reader-brightness:1;
  --reader-contrast:1;
  transition:filter .3s ease;
  filter:
  brightness(var(--reader-brightness))
  contrast(var(--reader-contrast));
}

#page-flip.mode-sepia{
  filter:
    sepia(.35)
    brightness(.95)
    brightness(var(--reader-brightness))
    contrast(.95)
    contrast(var(--reader-contrast));
}

#page-flip.mode-night{
  filter:
    invert(.88)
    hue-rotate(180deg)
    brightness(.82)
    brightness(var(--reader-brightness))
    contrast(.9)
    contrast(var(--reader-contrast));
}
    
  #reading-progress{
  position:fixed;
  top:60px;
  left:0;
  width:100%;
  height:4px;
  background:rgba(255,255,255,.12);
  z-index:9998;
}

#reading-progress-bar{
  width:0%;
  height:100%;
  background:#2563eb;
  transition:width .35s ease;
}
    #bookmark-panel{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10001;
  padding:20px;
}

.bookmark-panel-box{
  width:min(420px,100%);
  max-height:70vh;
  overflow:auto;
  background:white;
  color:#111827;
  border-radius:16px;
  padding:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.bookmark-panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

#close-bookmarks{
  border:0;
  background:#e5e7eb;
  border-radius:8px;
  padding:6px 10px;
  cursor:pointer;
}
#bookmark-search{
  width:100%;
  margin-bottom:12px;
  padding:10px 12px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:14px;
  outline:none;
}

#bookmark-search:focus{
  border-color:#2563eb;
}  
#favorite-filter{
  width:100%;
  margin-bottom:12px;
  padding:9px 12px;
  border:0;
  border-radius:10px;
  background:#e5e7eb;
  cursor:pointer;
  font-size:14px;
}

/* =========================================
   READER BOOKMARK RESET FILTER
   ========================================= */

#bookmark-reset-filter{
  width:100%;
  margin-bottom:12px;
  padding:9px 12px;

  border:
    1px solid var(--reader-border);

  border-radius:10px;

  background:
    var(--reader-surface-2);

  color:
    var(--reader-text);

  cursor:pointer;
  font-size:14px;
  font-weight:600;
}

#bookmark-reset-filter:hover{
  filter:brightness(1.05);
}

/* =========================================
   BOOKMARK FILTER STATUS
   ========================================= */

#bookmark-filter-status{
  width:100%;

  margin:
    -2px 0 12px;

  padding:
    8px 10px;

  background:
    var(--reader-surface-2);

  color:
    var(--reader-muted);

  border:
    1px solid var(--reader-border);

  border-radius:10px;

  font-size:12px;
  font-weight:600;

  text-align:center;
}
    
  #bookmark-sort{
  width:100%;
  margin-bottom:12px;
  padding:9px 12px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:white;
  font-size:14px;
  cursor:pointer;
}
#favorite-filter.active{
  background:#fef3c7;
  font-weight:600;
}
#bookmark-items button{
  margin:0;
  padding:10px 12px;
  border:0;
  border-radius:10px;
  background:#f1f5f9;
  cursor:pointer;
  text-align:left;
}
    .bookmark-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:5px 0;
}

/* =========================================
   CURRENT BOOKMARK ROW HIGHLIGHT
   ========================================= */

.bookmark-row.current-page{
  padding:6px;
  border-radius:12px;

  background:
    rgba(245, 158, 11, 0.12);

  outline:
    2px solid rgba(245, 158, 11, 0.55);
}

body.dark .bookmark-row.current-page{
  background:
    rgba(251, 191, 36, 0.10);

  outline:
    2px solid rgba(251, 191, 36, 0.50);
}

.bookmark-row > button:first-child{
  flex:1;
  width:0;
  min-width:0;
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.bookmark-row .bookmark-delete{
  width:auto;
  flex:0 0 auto;
  margin:0;
  padding:10px 12px;
  background:#fee2e2;
}

    .bookmark-row .bookmark-favorite{
  width:auto;
  flex:0 0 auto;
  margin:0;
  padding:10px 12px;
  background:#fef9c3;
}
    
    .bookmark-row .bookmark-edit{
  width:auto;
  flex:0 0 auto;
  margin:0;
  padding:10px 12px;
  background:#fef3c7;
}
    .label-short{
  display:none;
}

@media (max-width:600px) and (orientation:portrait){
  .label-long{
    display:none;
  }

  .label-short{
    display:inline;
  }
}

/* =========================================
   READER UI BASE THEME
   ========================================= */

.reader-header{
  background:var(--reader-surface);
  color:var(--reader-text);
  border-bottom:1px solid var(--reader-border);
}


/* Toolbar utama */

.page-controls{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}


/* Hamburger */

#toolbar-toggle{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}


/* Panel Brightness */

#brightness-panel{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}


/* Panel Contrast */

#contrast-panel{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}


/* Panel Preset */

#preset-panel{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}


/* Tombol umum Reader */

.back-button,
#reader-login-button,
#reader-logout-button,
.reader-login-box button,
.page-controls button,
#preset-panel button,
#bookmark-items button{
  background:var(--reader-surface-2);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}


/* =========================================
   BOOKMARK LIST BUTTON HIGHLIGHT
   ========================================= */

#bookmark-list{
  font-size:18px;
  font-weight:700;

  background:#2563eb;
  color:#ffffff;

  border:
    1px solid #1d4ed8;

  box-shadow:
    0 6px 16px rgba(37, 99, 235, 0.28);

  text-shadow:
    0 1px 1px rgba(0, 0, 0, 0.18);
}

#bookmark-list:hover{
  filter:brightness(1.06);
}

#bookmark-list:active{
  transform:translateY(1px);
}

body.dark #bookmark-list{
  background:#3b82f6;
  color:#ffffff;

  border:
    1px solid #60a5fa;

  box-shadow:
    0 6px 18px rgba(59, 130, 246, 0.30);
}
    
/* =========================================
   CURRENT PAGE BOOKMARK STATUS
   ========================================= */

#bookmark-page.bookmarked{
  background:#f59e0b;
  color:#111827;

  border:
    1px solid #d97706;

  box-shadow:
    0 6px 16px rgba(245, 158, 11, 0.30);

  font-weight:700;
}

body.dark #bookmark-page.bookmarked{
  background:#fbbf24;
  color:#111827;

  border:
    1px solid #f59e0b;

  box-shadow:
    0 6px 18px rgba(251, 191, 36, 0.28);
}

/* Input dan pilihan di panel */

#preset-panel input,
#preset-panel select,
.reader-login-box input{
  background:var(--reader-surface-2);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}


/* Login box */

.reader-login-box{
  background:var(--reader-surface);
  color:var(--reader-text);
  border:1px solid var(--reader-border);
}


/* Transisi Light / Dark */

.reader-header,
.page-controls,
#toolbar-toggle,
#brightness-panel,
#contrast-panel,
#preset-panel,
.reader-login-box,
.back-button,
#reader-login-button,
#reader-logout-button,
.page-controls button,
#preset-panel button{
  transition:
    background .3s ease,
    color .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}

   READER BOOKMARK BASE THEME
   ========================================= */

body.dark .bookmark-row .bookmark-favorite{
  background:#422006 !important;

/* Edit */

.bookmark-row .bookmark-edit{
  background:#fef3c7 !important;

body.dark .bookmark-row .bookmark-edit{

.bookmark-panel-box,
#bookmark-search,
#bookmark-sort,
#favorite-filter,
#bookmark-reset-filter,
#close-bookmarks,
#bookmark-items button{
  transition:
    background .3s ease,
    color .3s ease,
    border-color .3s ease,

/* =========================================
   READER CUSTOM DIALOG BASE THEME
   ========================================= */

#reader-dialog{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(15,23,42,.72);

  z-index:15000;
}


/* Saat dialog dibuka */

#reader-dialog.show{
  display:flex;
}


/* Kotak dialog */

.reader-dialog-box{
  width:min(420px,100%);

  background:var(--reader-surface);
  color:var(--reader-text);

  border:
    1px solid var(--reader-border);

  border-radius:18px;

  padding:18px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.32);
}


/* Header */

.reader-dialog-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:14px;
}


#reader-dialog-title{
  font-size:16px;
}


/* Tombol X */

#reader-dialog-close{
  flex:0 0 auto;

  padding:7px 10px;

  background:var(--reader-surface-2);
  color:var(--reader-text);

  border:
    1px solid var(--reader-border);

  border-radius:9px;

  cursor:pointer;
}


/* Pesan */

.reader-dialog-message{
  margin-bottom:12px;

  color:var(--reader-muted);

  font-size:14px;
  line-height:1.5;
}


/* Input */

#reader-dialog-input{
  width:100%;

  padding:11px 12px;

  background:var(--reader-surface-2);
  color:var(--reader-text);

  border:
    1px solid var(--reader-border);

  border-radius:10px;

  outline:none;

  font-size:15px;
}


#reader-dialog-input:focus{
  border-color:var(--reader-primary);

  box-shadow:
    0 0 0 3px rgba(37,99,235,.12);
}


/* Error */

.reader-dialog-error{
  min-height:18px;

  margin-top:7px;

  color:#ef4444;

  font-size:12px;
}


/* Tombol bawah */

.reader-dialog-actions{
  display:flex;

  gap:10px;

  margin-top:12px;
}


#reader-dialog-cancel,
#reader-dialog-confirm{
  flex:1;

  padding:10px 12px;

  border-radius:10px;

  cursor:pointer;
}


#reader-dialog-cancel{
  background:var(--reader-surface-2);
  color:var(--reader-text);

  border:
    1px solid var(--reader-border);
}


#reader-dialog-confirm{
  background:var(--reader-primary);
  color:white;

  border:
    1px solid var(--reader-primary);

  font-weight:700;
}


/* Transisi */

.reader-dialog-box,
#reader-dialog-close,
#reader-dialog-input,
#reader-dialog-cancel,
#reader-dialog-confirm{
  transition:
    background .3s ease,
    color .3s ease,
    border-color .3s ease,
    box-shadow .3s ease,
    transform .15s ease;
}


/* HP */

@media (max-width:600px){

  #reader-dialog{
    padding:16px;
  }

  .reader-dialog-box{
    width:100%;
    max-width:360px;

    padding:16px;

    border-radius:16px;
  }

}

    );

  }

  let updatedAt =
    "";

  try {

      new Date().toISOString();

  } catch (
    dateError
  ) {

    logError(

      dateError
    );

    return false;
  }

  try {

    const bookmarkTable =

    } =

        {

            user.id,

          book_key:

          updated_at:
            updatedAt
        },

    ) {

      saveError
    );

    return false;
  }

  return true;
}

async function loadBookmarksFromCloud() {

  const logWarn = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.warn ===
        "function"
    ) {

      console.warn(
        ...args
      );
    }
  };

  const logError = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.error ===
        "function"
    ) {

      console.error(
        ...args
      );
    }
  };

  if (
    typeof db ===
      "undefined" ||
    !db ||
    !db.auth ||
    typeof db.auth.getUser !==
      "function" ||
    typeof db.from !==
      "function"
  ) {

    logWarn(
      "Supabase tidak tersedia untuk memuat bookmark Reader."
    );

    return false;
  }

  if (
    typeof bookmarkKey !==
      "string" ||
    !bookmarkKey.trim() ||
    bookmarkKey.trim() ===
      "bookmarks:"
  ) {

    logWarn(
      "Book key bookmark Reader tidak valid."
    );

    return false;
  }

  if (
    typeof bookmarks ===
      "undefined" ||
    !Array.isArray(
      bookmarks
    )
  ) {

    logWarn(
      "State bookmark Reader tidak valid."
    );

    return false;
  }

  let user =
    null;

  try {

    const userResult =
      await db.auth.getUser();

    const userError =
      userResult &&
      userResult.error
        ? userResult.error
        : null;

    user =
      userResult &&
      userResult.data &&
      userResult.data.user
        ? userResult.data.user
        : null;

    if (
      userError
    ) {

      logWarn(
        "Gagal membaca user untuk memuat bookmark Reader:",
        userError
      );

      return false;
    }

    if (
      !user ||
      !user.id
    ) {

      return false;
    }

  } catch (
    userReadError
  ) {

    logError(
      "Gagal membaca user untuk memuat bookmark Reader:",
      userReadError
    );

    return false;
  }

  let data =
    null;

  try {

    const bookmarkTable =
      db.from(
        "reader_bookmarks"
      );

    if (
      !bookmarkTable ||
      typeof bookmarkTable.select !==
        "function"
    ) {

      logWarn(
        "Tabel reader_bookmarks tidak tersedia."
      );

      return false;
    }

    const query =
      bookmarkTable
        .select(
          "bookmarks"
        )
        .eq(
          "user_id",
          user.id
        )
        .eq(
          "book_key",
          bookmarkKey.trim()
        );

    if (
      !query ||
      typeof query.maybeSingle !==
        "function"
    ) {

      logWarn(
        "Query reader_bookmarks tidak mendukung maybeSingle."
      );

      return false;
    }

    const result =
      await query.maybeSingle();

    const error =
      result &&
      result.error
        ? result.error
        : null;

    data =
      result
        ? result.data
        : null;

    if (
      error
    ) {

      logError(
        "Gagal mengambil bookmark Reader dari cloud:",
        error
      );

      return false;
    }

  } catch (
    queryError
  ) {

    logError(
      "Gagal mengambil bookmark Reader dari cloud:",
      queryError
    );

    return false;
  }

  if (
    data
  ) {

    if (
      !Array.isArray(
        data.bookmarks
      )
    ) {

      logWarn(
        "Data bookmark cloud bukan array yang valid."
      );

      return false;
    }

    const uniqueBookmarks =
      new Map();

    for (
      const rawItem of
      data.bookmarks
    ) {

      let normalizedItem =
        null;

      if (
        typeof rawItem ===
          "number"
      ) {

        const page =
          Math.trunc(
            rawItem
          );

        if (
          page < 1
        ) {

          continue;
        }

        normalizedItem = {
          page:
            page,

          title:
            "",

          favorite:
            false
        };

      } else if (
        rawItem &&
        typeof rawItem ===
          "object" &&
        !Array.isArray(
          rawItem
        )
      ) {

        const numericPage =
          Number(
            rawItem.page
          );

        if (
          !Number.isFinite(
            numericPage
          )
        ) {

          continue;
        }

        const page =
          Math.trunc(
            numericPage
          );

        if (
          page < 1
        ) {

          continue;
        }

        normalizedItem = {
          page:
            page,

          title:
            typeof rawItem.title ===
              "string"
              ? rawItem.title.trim()
              : "",

          favorite:
            Boolean(
              rawItem.favorite
            )
        };

      } else {

        continue;
      }

      const existing =
        uniqueBookmarks.get(
          normalizedItem.page
        );

      if (
        !existing
      ) {

        uniqueBookmarks.set(
          normalizedItem.page,
          normalizedItem
        );

        continue;
      }

      if (
        !existing.title &&
        normalizedItem.title
      ) {

        existing.title =
          normalizedItem.title;
      }

      if (
        normalizedItem.favorite
      ) {

        existing.favorite =
          true;
      }
    }

    const normalizedBookmarks =
      [];

    for (
      const item of
      uniqueBookmarks.values()
    ) {

      let inserted =
        false;

      for (
        let index = 0;
        index <
          normalizedBookmarks.length;
        index += 1
      ) {

        if (
          item.page <
          normalizedBookmarks[index].page
        ) {

          normalizedBookmarks.splice(
            index,
            0,
            item
          );

          inserted =
            true;

          break;
        }
      }

      if (
        !inserted
      ) {

        normalizedBookmarks.push(
          item
        );
      }
    }

    let perluMigrasiCloud =
      false;

    try {

      perluMigrasiCloud =
        JSON.stringify(
          normalizedBookmarks
        ) !==
        JSON.stringify(
          data.bookmarks
        );

    } catch (
      compareError
    ) {

      logWarn(
        "Perbandingan format bookmark cloud gagal:",
        compareError
      );

      perluMigrasiCloud =
        true;
    }

    bookmarks =
      normalizedBookmarks;

    if (
      typeof localStorage !==
        "undefined" &&
      typeof localStorage.setItem ===
        "function"
    ) {

      try {

        localStorage.setItem(
          bookmarkKey,
          JSON.stringify(
            bookmarks
          )
        );

      } catch (
        localWriteError
      ) {

        logWarn(
          "Bookmark Reader gagal disimpan ke localStorage:",
          localWriteError
        );
      }
    }

    if (
      typeof updateBookmarkListButton ===
        "function"
    ) {

      try {

        updateBookmarkListButton();

      } catch (
        listButtonError
      ) {

        logWarn(
          "Tombol daftar bookmark gagal diperbarui:",

async function renderPDFPages() {

  const logWarn = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.warn ===
        "function"
    ) {

      console.warn(
        ...args
      );
    }
  };

  const logError = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.error ===
        "function"
    ) {

      console.error(
        ...args
      );
    }
  };

  if (
    typeof pdfDoc ===
      "undefined" ||
    !pdfDoc ||
    typeof pdfDoc.getPage !==
      "function"
  ) {

    logWarn(
      "Dokumen PDF belum tersedia untuk dirender."
    );

    return [];
  }

  const totalPages =
    Number(
      pdfDoc.numPages
    );

  if (
    !Number.isInteger(
      totalPages
    ) ||
    totalPages < 1
  ) {

    logWarn(
      "Jumlah halaman PDF tidak valid:",
      pdfDoc.numPages
    );

    return [];
  }

  if (
    typeof document ===
      "undefined" ||
    typeof document.createElement !==
      "function"
  ) {

    logWarn(
      "Document tidak tersedia untuk membuat canvas PDF."
    );

    return [];
  }

  const images =
    [];

  try {

    for (
      let num = 1;
      num <= totalPages;
      num++
    ) {

      let page =
        null;

      try {

        page =
          await pdfDoc.getPage(
            num
          );

        if (
          !page ||
          typeof page.getViewport !==
            "function" ||
          typeof page.render !==
            "function"
        ) {

          throw new Error(
            `Halaman PDF ${num} tidak valid.`
          );
        }

        const viewport =
          page.getViewport({
            scale: 1.4
          });

        if (
          !viewport ||
          !Number.isFinite(
            Number(
              viewport.width
            )
          ) ||
          !Number.isFinite(
            Number(
              viewport.height
            )
          ) ||
          Number(
            viewport.width
          ) <= 0 ||
          Number(
            viewport.height
          ) <= 0
        ) {

          throw new Error(
            `Viewport halaman PDF ${num} tidak valid.`
          );
        }

        const canvas =
          document.createElement(
            "canvas"
          );

        if (
          !canvas ||
          typeof canvas.getContext !==
            "function" ||
          typeof canvas.toDataURL !==
            "function"
        ) {

          throw new Error(
            `Canvas halaman PDF ${num} tidak tersedia.`
          );
        }

        const context =
          canvas.getContext(
            "2d"
          );

        if (
          !context
        ) {

          throw new Error(
            `Context 2D halaman PDF ${num} tidak tersedia.`
          );
        }

        canvas.width =
          Math.ceil(
            Number(
              viewport.width
            )
          );

        canvas.height =
          Math.ceil(
            Number(
              viewport.height
            )
          );

        const renderTask =
          page.render({
            canvasContext:
              context,

            viewport:
              viewport
          });

        if (
          !renderTask ||
          !renderTask.promise ||
          typeof renderTask.promise.then !==
            "function"
        ) {

          throw new Error(
            `Render task halaman PDF ${num} tidak valid.`
          );
        }

        await renderTask.promise;

        const imageData =
          canvas.toDataURL(
            "image/jpeg",
            0.92
          );

        if (
          typeof imageData !==
            "string" ||
          !imageData.startsWith(
            "data:image/jpeg"
          )
        ) {

          throw new Error(
            `Hasil render halaman PDF ${num} tidak valid.`
          );
        }

        images.push(
          imageData
        );

      } catch (
        pageError
      ) {

        logError(
          `Gagal merender halaman PDF ${num}:`,
          pageError
        );

        return [];

      } finally {

        if (
          page &&
          typeof page.cleanup ===
            "function"
        ) {

          try {

            page.cleanup();

          } catch (
            cleanupError
          ) {

            logWarn(
              `Cleanup halaman PDF ${num} gagal:`,
              cleanupError
            );
          }
        }
      }
    }

  } catch (
    renderError
  ) {

    logError(
      "Proses render halaman PDF gagal:",
      renderError
    );

    return [];
  }

  if (
    images.length !==
      totalPages
  ) {

    logWarn(
      "Jumlah hasil render PDF tidak sesuai jumlah halaman.",
      {
        expected:
          totalPages,
        actual:
          images.length
      }
    );

    return [];
  }

  return images;
}

      firstPage.getViewport({
        scale: 1
      });

    if (
      !firstViewport
    ) {

      throw new Error(
        "Viewport halaman pertama PDF tidak tersedia."
      );
    }

    const viewportWidth =
      Number(
        firstViewport.width
      );

    const viewportHeight =
      Number(
        firstViewport.height
      );

    if (
      !Number.isFinite(
        viewportWidth
      ) ||
      !Number.isFinite(
        viewportHeight
      ) ||
      viewportWidth <= 0 ||
      viewportHeight <= 0
    ) {

      throw new Error(
        "Ukuran halaman pertama PDF tidak valid."
      );
    }

    const ratio =
      viewportHeight /
      viewportWidth;

    if (
      !Number.isFinite(
        ratio
      ) ||
      ratio <= 0
    ) {

      throw new Error(
        "Rasio halaman PDF tidak valid."
      );
    }

    const pageWidth =
      480;

    const pageHeight =
      Math.round(
        pageWidth *
        ratio
      );

    if (
      !Number.isInteger(
        pageHeight
      ) ||
      pageHeight < 1
    ) {

      throw new Error(
        "Tinggi halaman PageFlip tidak valid."
      );
    }

    if (
      firstPage &&
      typeof firstPage.cleanup ===
        "function"
    ) {

      try {

        firstPage.cleanup();

      } catch (
        cleanupError
      ) {

        logWarn(
          "Cleanup halaman pertama PDF gagal:",
          cleanupError
        );
      }

      firstPage =
        null;
    }

    const images =
      await renderPDFPages();

    if (
      !Array.isArray(
        images
      ) ||
      images.length !==
        totalPages ||
      images.length < 1
    ) {

      throw new Error(
        "Hasil render halaman PDF tidak lengkap."
      );
    }

    if (
      typeof pageFlip !==
        "undefined" &&
      pageFlip &&
      typeof pageFlip.destroy ===
        "function"
    ) {

      try {

        pageFlip.destroy();

      } catch (
        destroyError
      ) {

        logWarn(
          "Instance PageFlip sebelumnya gagal dibersihkan:",
          destroyError
        );
      }
    }

    pageFlipElement.innerHTML =
      "";

    pageFlip =
      new St.PageFlip(
        pageFlipElement,
        {
          width:
            pageWidth,

          height:
            pageHeight,

          startPage:
            startIndex,

          size:
            "stretch",

          minWidth:
            280,

          maxWidth:
            pageWidth,

          minHeight:
            Math.round(
              280 *
              ratio
            ),

          maxHeight:
            pageHeight,

          drawShadow:
            true,

          flippingTime:
            900,

          usePortrait:
            true,

          autoSize:
            true,

          maxShadowOpacity:
            0.5,

          showCover:
            true,

          mobileScrollSupport:
            false
        }
      );

    if (
      !pageFlip ||
      typeof pageFlip.on !==
        "function" ||
      typeof pageFlip.loadFromImages !==
        "function" ||
      typeof pageFlip.getCurrentPageIndex !==
        "function" ||
      typeof pageFlip.getOrientation !==
        "function"
    ) {

      throw new Error(
        "Instance PageFlip tidak valid."
      );
    }

    function updateReadingStatus(
      currentIndex
    ) {

      const logWarn = (
        ...args
      ) => {

        if (
          typeof console !==
            "undefined" &&
          typeof console.warn ===
            "function"
        ) {

          console.warn(
            ...args
          );
        }
      };

      if (
        typeof pageFlip ===
          "undefined" ||
        !pageFlip ||
        typeof pageFlip.getCurrentPageIndex !==
          "function" ||
        typeof pageFlip.getOrientation !==
          "function"
      ) {

        logWarn(
          "PageFlip belum siap untuk memperbarui status membaca."
        );

        return false;
      }

      if (
        typeof pdfDoc ===
          "undefined" ||
        !pdfDoc
      ) {

        logWarn(
          "Dokumen PDF belum tersedia untuk memperbarui status membaca."
        );

        return false;
      }

      const totalPages =
        Number(
          pdfDoc.numPages
        );

      if (
        !Number.isInteger(
          totalPages
        ) ||
        totalPages < 1
      ) {

        logWarn(
          "Jumlah halaman PDF tidak valid:",
          pdfDoc.numPages
        );

        return false;
      }

      let indexValue =
        currentIndex;

      if (
        typeof indexValue ===
          "undefined" ||
        indexValue ===
          null
      ) {

        try {

          indexValue =
            pageFlip.getCurrentPageIndex();

        } catch (
          indexError
        ) {

          logWarn(
            "Index halaman Reader gagal dibaca:",
            indexError
          );

          return false;
        }
      }

      indexValue =
        Number(
          indexValue
        );

      if (
        !Number.isInteger(
          indexValue
        ) ||
        indexValue < 0 ||
        indexValue >= totalPages
      ) {

        logWarn(
          "Index halaman Reader tidak valid:",
          indexValue
        );

        return false;
      }

      if (
        typeof document ===
          "undefined" ||
        typeof document.getElementById !==
          "function"
      ) {

        logWarn(
          "Document tidak tersedia untuk memperbarui status membaca."
        );

        return false;
      }

      const pageNumberElement =
        document.getElementById(
          "page-num"
        );

      const progressBar =
        document.getElementById(
          "reading-progress-bar"
        );

      if (
        !pageNumberElement
      ) {

        logWarn(
          "Elemen page-num Reader tidak ditemukan."
        );

        return false;
      }

      if (
        !progressBar ||
        !progressBar.style
      ) {

        logWarn(
          "Elemen reading-progress-bar Reader tidak ditemukan."
        );

        return false;
      }

      let orientation;

      try {

        orientation =
          pageFlip.getOrientation();

      } catch (
        orientationError
      ) {

        logWarn(
          "Orientasi PageFlip gagal dibaca:",
          orientationError
        );

        return false;
      }

      const startPage =
        indexValue + 1;

      let pageLabel =
        String(
          startPage
        );

      let progressPage =
        startPage;

      if (
        orientation ===
          "landscape" &&
        indexValue > 0
      ) {

        const endPage =
          Math.min(
            startPage + 1,
            totalPages
          );

        pageLabel =
          startPage ===
            endPage
            ? String(
                startPage
              )
            : startPage +
              "-" +
              endPage;

        progressPage =
          endPage;
      }

      try {

        pageNum =
          startPage;

        pageNumberElement.textContent =
          pageLabel;

        const progress =
          (
            progressPage /
            totalPages
          ) *
          100;

        progressBar.style.width =
          progress +
          "%";

      } catch (
        updateError
      ) {

        logWarn(
          "Status membaca Reader gagal diperbarui:",
          updateError
        );

        return false;
      }

      return true;
    }
    /*Batas Nested Function*/

    pageFlip.on(
      "flip",
      (e) => {

        const logWarn = (
          ...args
        ) => {

          if (
            typeof console !==
              "undefined" &&
            typeof console.warn ===
              "function"
          ) {

            console.warn(
              ...args
            );
          }
        };

        const currentIndex =
          e &&
          typeof e ===
            "object"
            ? Number(
                e.data
              )
            : NaN;

        const totalPages =
          typeof pdfDoc !==
            "undefined" &&
          pdfDoc
            ? Number(
                pdfDoc.numPages
              )
            : NaN;

        if (
          !Number.isInteger(
            currentIndex
          ) ||
          currentIndex < 0
        ) {

          logWarn(
            "Index halaman hasil event flip tidak valid:",
            e
          );

          return false;
        }

        if (
          !Number.isInteger(
            totalPages
          ) ||
          totalPages < 1 ||
          currentIndex >=
            totalPages
        ) {

          logWarn(
            "Index halaman hasil event flip berada di luar batas PDF:",
            {
              currentIndex:
                currentIndex,
              totalPages:
                totalPages
            }
          );

          return false;
        }

        pageNum =
          currentIndex + 1;

        if (
          typeof localStorage !==
            "undefined" &&
          typeof localStorage.setItem ===
            "function" &&
          typeof readingKey ===
            "string" &&
          readingKey.trim()
        ) {

          try {

            localStorage.setItem(
              readingKey,
              String(
                pageNum
              )
            );

          } catch (
            storageError
          ) {

            logWarn(
              "Progress membaca lokal gagal disimpan:",
              storageError
            );
          }

        } else {

          logWarn(
            "Penyimpanan progress membaca lokal tidak tersedia."
          );
        }

        if (
          typeof scheduleReadingProgressCloudSave ===
            "function"
        ) {

          try {

            const scheduleResult =
              scheduleReadingProgressCloudSave();

            if (
              scheduleResult ===
                false
            ) {

              logWarn(
                "Penjadwalan penyimpanan progress membaca ke cloud gagal."
              );
            }

          } catch (
            scheduleError
          ) {

            logWarn(
              "Penjadwalan progress membaca ke cloud mengalami error:",
              scheduleError
            );
          }

        } else {

          logWarn(
            "scheduleReadingProgressCloudSave() tidak tersedia."
          );
        }

        if (
          typeof updateReadingStatus ===
            "function"
        ) {

          try {

            const statusResult =
              updateReadingStatus(
                currentIndex
              );

            if (
              statusResult ===
                false
            ) {

              logWarn(
                "Status membaca gagal diperbarui setelah flip halaman."
              );
            }

          } catch (
            statusError
          ) {

            logWarn(
              "Update status membaca setelah flip mengalami error:",
              statusError
            );
          }

        } else {

          logWarn(
            "updateReadingStatus() tidak tersedia."
          );
        }

        if (
          typeof updateCurrentPageBookmarkStatus ===
            "function"
        ) {

          try {

            const bookmarkResult =
              updateCurrentPageBookmarkStatus();

            if (
              bookmarkResult ===
                false
            ) {

              logWarn(
                "Status bookmark halaman aktif gagal diperbarui."
              );
            }

          } catch (
            bookmarkError
          ) {

            logWarn(
              "Update status bookmark setelah flip mengalami error:",
              bookmarkError
            );
          }

        } else {

          logWarn(
            "updateCurrentPageBookmarkStatus() tidak tersedia."
          );
        }

        return true;
      }
    );

    pageFlip.on(
      "changeOrientation",
      () => {

        const logWarn = (
          ...args
        ) => {

          if (
            typeof console !==
              "undefined" &&
            typeof console.warn ===
              "function"
          ) {

            console.warn(
              ...args
            );
          }
        };

        if (
          typeof updateReadingStatus ===
            "function"
        ) {

          try {

            const statusResult =
              updateReadingStatus();

            if (
              statusResult ===
                false
            ) {

              logWarn(
                "Status membaca gagal diperbarui setelah perubahan orientasi."
              );
            }

          } catch (
            statusError
          ) {

            logWarn(
              "Update status membaca setelah perubahan orientasi mengalami error:",
              statusError
            );
          }

        } else {

          logWarn(
            "updateReadingStatus() tidak tersedia."
          );
        }

        if (
          typeof updateCurrentPageBookmarkStatus ===
            "function"
        ) {

          try {

            const bookmarkResult =
              updateCurrentPageBookmarkStatus();

            if (
              bookmarkResult ===
                false
            ) {

              logWarn(
                "Status bookmark halaman aktif gagal diperbarui setelah perubahan orientasi."
              );
            }

          } catch (
            bookmarkError
          ) {

            logWarn(
              "Update status bookmark setelah perubahan orientasi mengalami error:",
              bookmarkError
            );
          }

        } else {

          logWarn(
            "updateCurrentPageBookmarkStatus() tidak tersedia."
          );
        }

        return true;
      }
    );

    pageFlip.on(
      "changeState",
      (e) => {

        const logWarn = (
          ...args
        ) => {

          if (
            typeof console !==
              "undefined" &&
            typeof console.warn ===
              "function"
          ) {

            console.warn(
              ...args
            );
          }
        };

        const state =
          e &&
          typeof e ===
            "object" &&
          typeof e.data ===
            "string"
            ? e.data
            : "";

        if (
          !state
        ) {

          logWarn(
            "State PageFlip dari event changeState tidak valid:",
            e
          );

          return false;
        }

        if (
          state !==
            "flipping"
        ) {

          return true;
        }

        if (
          typeof playPageFlipSound !==
            "function"
        ) {

          logWarn(
            "playPageFlipSound() tidak tersedia."
          );

          return false;
        }

        try {

          const soundResult =
            playPageFlipSound();

          if (
            soundResult ===
              false
          ) {

            logWarn(
              "Suara flip halaman gagal diputar."
            );

            return false;
          }

        } catch (
          soundError
        ) {

          logWarn(
            "Pemutaran suara flip halaman mengalami error:",
            soundError
          );

          return false;
        }

        return true;
      }
    );

    pageFlip.on(
      "init",
      () => {

        const logWarn = (
          ...args
        ) => {

          if (
            typeof console !==
              "undefined" &&
            typeof console.warn ===
              "function"
          ) {

            console.warn(
              ...args
            );
          }
        };

        if (
          typeof updateReadingStatus ===
            "function"
        ) {

          try {

            const statusResult =
              updateReadingStatus();

            if (
              statusResult ===
                false
            ) {

              logWarn(
                "Status membaca gagal diperbarui saat PageFlip diinisialisasi."
              );
            }

          } catch (
            statusError
          ) {

            logWarn(
              "Update status membaca saat inisialisasi PageFlip mengalami error:",
              statusError
            );
          }

        } else {

          logWarn(
            "updateReadingStatus() tidak tersedia."
          );
        }

        if (
          typeof updateCurrentPageBookmarkStatus ===
            "function"
        ) {

          try {

            const bookmarkResult =
              updateCurrentPageBookmarkStatus();

            if (
              bookmarkResult ===
                false
            ) {

              logWarn(
                "Status bookmark halaman aktif gagal diperbarui saat PageFlip diinisialisasi."
              );
            }

          } catch (
            bookmarkError
          ) {

            logWarn(
              "Update status bookmark saat inisialisasi PageFlip mengalami error:",
              bookmarkError
            );
          }

        } else {

          logWarn(
            "updateCurrentPageBookmarkStatus() tidak tersedia."
          );
        }

        return true;
      }
    );

    pageFlip.loadFromImages(
      images
    );

    return true;

  } catch (
    loadError
  ) {

    logError(
      "Reader PDF gagal dimuat:",
      loadError
    );

    if (
      firstPage &&
      typeof firstPage.cleanup ===
        "function"
    ) {

      try {

        firstPage.cleanup();

      } catch (
        cleanupError
      ) {

        logWarn(
          "Cleanup halaman pertama setelah kegagalan loadPDF() gagal:",
          cleanupError
        );
      }
    }

    if (
      typeof pageFlip !==
        "undefined" &&
      pageFlip &&
      typeof pageFlip.destroy ===
        "function"
    ) {

      try {

        pageFlip.destroy();

      } catch (
        destroyError
      ) {

        logWarn(
          "Cleanup PageFlip setelah kegagalan loadPDF() gagal:",
          destroyError
        );
      }
    }

    if (
      typeof showReaderNotice ===
        "function"
    ) {

      try {

        showReaderNotice(
          "⚠️ Gagal Membuka Buku",
          "File PDF gagal dimuat. Silakan coba lagi."
        );

      } catch (
        noticeError
      ) {

        logWarn(
          "Notifikasi kegagalan Reader PDF tidak dapat ditampilkan:",
          noticeError
        );
      }
    }

    return false;
  }
}

document.getElementById("prev-page").addEventListener("click", () => {
  if (!pageFlip || pageFlip.getCurrentPageIndex() <= 0) return;
  pageFlip.flipPrev("bottom");
});

document.getElementById("next-page").addEventListener("click", () => {
  if (
    !pageFlip ||
    pageFlip.getCurrentPageIndex() >= pageFlip.getPageCount() - 1
  ) return;

  pageFlip.flipNext("bottom");
});

/* =========================================
   READER CUSTOM DIALOG
   ========================================= */

const readerDialog =
  document.getElementById("reader-dialog");

const readerDialogTitle =
  document.getElementById("reader-dialog-title");

const readerDialogMessage =
  document.getElementById("reader-dialog-message");

const readerDialogInput =
  document.getElementById("reader-dialog-input");

const readerDialogError =
  document.getElementById("reader-dialog-error");

const readerDialogConfirm =
  document.getElementById("reader-dialog-confirm");

const readerDialogCancel =
  document.getElementById("reader-dialog-cancel");

const readerDialogClose =
  document.getElementById("reader-dialog-close");


let readerDialogAction = null;

/* Buka dialog */
function openReaderDialog({
  title = "Input",
  message = "",
  value = "",
  type = "text",
  action = null
} = {}) {

  const logWarn = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.warn ===
        "function"
    ) {

      console.warn(
        ...args
      );
    }
  };

  if (
    typeof readerDialogTitle ===
      "undefined" ||
    !readerDialogTitle ||
    typeof readerDialogMessage ===
      "undefined" ||
    !readerDialogMessage ||
    typeof readerDialogInput ===
      "undefined" ||
    !readerDialogInput ||
    typeof readerDialogError ===
      "undefined" ||
    !readerDialogError ||
    typeof readerDialogCancel ===
      "undefined" ||
    !readerDialogCancel ||
    typeof readerDialogConfirm ===
      "undefined" ||
    !readerDialogConfirm ||
    typeof readerDialog ===
      "undefined" ||
    !readerDialog
  ) {

    logWarn(
      "Elemen Reader Dialog belum lengkap."
    );

    return false;
  }

  if (
    !readerDialogInput.style ||
    !readerDialogCancel.style ||
    !readerDialog.classList ||
    typeof readerDialog.classList.add !==
      "function"
  ) {

    logWarn(
      "Struktur elemen Reader Dialog tidak valid."
    );

    return false;
  }

  const safeTitle =
    typeof title ===
      "string"
      ? title
      : String(
          title ?? ""
        );

  const safeMessage =
    typeof message ===
      "string"
      ? message
      : String(
          message ?? ""
        );

  const safeValue =
    typeof value ===
      "string"
      ? value
      : String(
          value ?? ""
        );

  const safeType =
    typeof type ===
      "string" &&
    type.trim()
      ? type.trim()
      : "text";

  if (
    action !== null &&
    typeof action !==
      "function"
  ) {

    logWarn(
      "Action Reader Dialog bukan function:",
      action
    );

    return false;
  }

  try {

    readerDialogTitle.textContent =
      safeTitle;

    readerDialogMessage.textContent =
      safeMessage;

    readerDialogInput.type =
      safeType;

    readerDialogInput.value =
      safeValue;

    readerDialogError.textContent =
      "";

    readerDialogInput.style.display =
      "";

    readerDialogCancel.style.display =
      "";

    readerDialogConfirm.textContent =
      "OK";

    readerDialogAction =
      action;

    readerDialog.classList.add(
      "show"
    );

  } catch (
    dialogError
  ) {

    logWarn(
      "Reader Dialog gagal dibuka:",
      dialogError
    );

    return false;
  }

  if (
    typeof setTimeout !==
      "function"
  ) {

    logWarn(
      "setTimeout tidak tersedia untuk fokus Reader Dialog."
    );

    return true;
  }

  try {

    setTimeout(
      () => {

        const logWarn = (
          ...args
        ) => {

          if (
            typeof console !==
              "undefined" &&
            typeof console.warn ===
              "function"
          ) {

            console.warn(
              ...args
            );
          }
        };

        if (
          typeof readerDialogInput ===
            "undefined" ||
          !readerDialogInput
        ) {

          logWarn(
            "Input Reader Dialog tidak tersedia untuk menerima fokus."
          );

          return false;
        }

        if (
          typeof readerDialogInput.focus ===
            "function"
        ) {

          try {

            readerDialogInput.focus();

          } catch (
            focusError
          ) {

            logWarn(
              "Fokus Reader Dialog gagal:",
              focusError
            );
          }

        } else {

          logWarn(
            "Method focus() Reader Dialog tidak tersedia."
          );
        }

        if (
          typeof readerDialogInput.select ===
            "function"
        ) {

          try {

            readerDialogInput.select();

          } catch (
            selectError
          ) {

            logWarn(
              "Seleksi input Reader Dialog gagal:",
              selectError
            );
          }
        }

        return true;
      },
      50
    );

  } catch (
    timerError
  ) {

    logWarn(
      "Penjadwalan fokus Reader Dialog gagal:",
      timerError
    );
  }

  return true;
}
/*BATAS FUNCTION*/

/* Tutup dialog */
function closeReaderDialog() {

  const logWarn = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.warn ===
        "function"
    ) {

      console.warn(
        ...args
      );
    }
  };

  if (
    typeof readerDialog ===
      "undefined" ||
    !readerDialog ||
    !readerDialog.classList ||
    typeof readerDialog.classList.remove !==
      "function"
  ) {

    logWarn(
      "Reader Dialog tidak tersedia untuk ditutup."
    );

    return false;
  }

  if (
    typeof readerDialogError ===
      "undefined" ||
    !readerDialogError
  ) {

    logWarn(
      "Elemen error Reader Dialog tidak tersedia."

  try {

    );

}

/* =========================================
   READER NOTICE
   ========================================= */

function showReaderNotice(
  title,
  message
) {

  const logWarn = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.warn ===
        "function"
    ) {

      console.warn(
        ...args
      );
    }
  };

  if (
    typeof openReaderDialog !==
      "function"
  ) {

    logWarn(
      "openReaderDialog() tidak tersedia untuk menampilkan notice Reader."
    );

    return false;
  }

  let openResult;

  try {

    openResult =
      openReaderDialog({

        title:
          title,

        message:
          message,

        value:
          "",

        type:
          "text",

        action:
          () => true
      });

  } catch (
    openError
  ) {

    logWarn(
      "Reader Notice gagal membuka dialog:",
      openError
    );

    return false;
  }

  if (
    openResult ===
      false
  ) {

    logWarn(
      "Reader Notice gagal karena openReaderDialog() mengembalikan false."
    );

    return false;
  }

  if (
    typeof readerDialogInput ===
      "undefined" ||
    !readerDialogInput ||
    !readerDialogInput.style ||
    typeof readerDialogCancel ===
      "undefined" ||
    !readerDialogCancel ||
    !readerDialogCancel.style ||
    typeof readerDialogConfirm ===
      "undefined" ||
    !readerDialogConfirm

  function tampilkanBookmarks() {
    const panel = document.getElementById("bookmark-panel");
    const items = document.getElementById("bookmark-items");
    const status = document.getElementById("bookmark-filter-status");
    const search = document.getElementById("bookmark-search");
    const keyword = search.value.trim().toLowerCase();
    const favoriteOnly = document.getElementById("favorite-filter").classList.contains("active");
    const sortMode = document.getElementById("bookmark-sort").value;
      items.innerHTML = "";
    if (status) {
  status.textContent =
    "Menampilkan 0 dari " +
    bookmarks.length +
    " bookmark";
}

  if (bookmarks.length === 0) {
    items.innerHTML = "<p>Belum ada bookmark.</p>";
  } else {
    const filteredBookmarks = bookmarks.filter((item) => {
  const text =
    ("halaman " + item.page + " " + (item.title || "")).toLowerCase();

  return (
  text.includes(keyword) &&
  (!favoriteOnly || item.favorite)
);
});

if (sortMode === "page") {
  filteredBookmarks.sort((a, b) => a.page - b.page);
}

if (sortMode === "title") {
  filteredBookmarks.sort((a, b) =>
    (a.title || "").localeCompare(b.title || "")
  );
}

if (sortMode === "favorite") {
  filteredBookmarks.sort((a, b) => {
    if (Boolean(b.favorite) !== Boolean(a.favorite)) {
      return Number(Boolean(b.favorite)) - Number(Boolean(a.favorite));
    }

    return a.page - b.page;
  });
}

  status.textContent =
    "Menampilkan " +
    filteredBookmarks.length +

    bookmarks.length +

  async function toggleFullscreen() {
  const elem = document.documentElement;

  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (elem.requestFullscreen) {
        await elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  } catch (error) {
    console.log("Fullscreen gagal:", error);
  }
}

function applySavedContrast() {

  const logWarn = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.warn ===
        "function"
    ) {

      console.warn(
        ...args
      );
    }
  };

  if (
    typeof document ===
      "undefined" ||
    typeof document.getElementById !==
      "function"
  ) {

    logWarn(
      "Document tidak tersedia untuk menerapkan contrast Reader."
    );

    return false;
  }

  const contrastValue =
    typeof contrastLevel !==
      "undefined"
      ? Number(
          contrastLevel
        )
      : NaN;

  if (
    !Number.isFinite(
      contrastValue
    ) ||
    contrastValue < 70 ||
    contrastValue > 150
  ) {

    logWarn(
      "contrastLevel Reader tidak valid:",
      contrastLevel
    );

    return false;
  }

  const slider =
    document.getElementById(
      "contrast-slider"
    );

  const valueLabel =
    document.getElementById(
      "contrast-value"
    );

  const page =
    document.getElementById(
      "page-flip"
    );

  if (
    !slider
  ) {

    logWarn(
      "Slider contrast Reader tidak ditemukan."
    );

    return false;
  }

  if (
    !valueLabel
  ) {

    logWarn(
      "Label contrast Reader tidak ditemukan."
    );

    return false;
  }

  if (
    !page ||
    !page.style ||
    typeof page.style.setProperty !==
      "function"
  ) {

    logWarn(
      "Elemen page-flip Reader tidak tersedia untuk menerapkan contrast."
    );

    return false;
  }

  try {

    slider.value =
      contrastValue;

    valueLabel.textContent =
      contrastValue +
      "%";

    page.style.setProperty(
      "--reader-contrast",
      contrastValue / 100
    );

  } catch (
    applyError
  ) {

    logWarn(
      "Contrast Reader gagal diterapkan:",
      applyError
    );

    return false;
  }

  return true;
}

async function saveReaderSettingsToCloud() {

  const logWarn = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.warn ===
        "function"
    ) {

      console.warn(
        ...args
      );
    }
  };

  const logError = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.error ===
        "function"
    ) {

      console.error(
        ...args
      );
    }
  };

  if (
    typeof db ===
      "undefined" ||
    !db ||
    !db.auth ||
    typeof db.auth.getUser !==
      "function" ||
    typeof db.from !==
      "function"
  ) {

    logWarn(
      "Supabase tidak tersedia untuk menyimpan pengaturan Reader."
    );

    return false;
  }

  const readingModeValue =
    typeof readingMode !==
      "undefined"
      ? Number(
          readingMode
        )
      : NaN;

  const zoomValue =
    typeof zoomLevel !==
      "undefined"
      ? Number(
          zoomLevel
        )
      : NaN;

  const brightnessValue =
    typeof brightnessLevel !==
      "undefined"
      ? Number(
          brightnessLevel
        )
      : NaN;

  const contrastValue =
    typeof contrastLevel !==
      "undefined"
      ? Number(
          contrastLevel
        )
      : NaN;

  if (
    !Number.isInteger(
      readingModeValue
    ) ||
    readingModeValue < 0 ||
    readingModeValue > 2
  ) {

    logWarn(
      "readingMode Reader tidak valid:",
      readingMode
    );

    return false;
  }

  if (
    !Number.isFinite(
      zoomValue
    ) ||
    zoomValue < 0.6 ||
    zoomValue > 2
  ) {

    logWarn(
      "zoomLevel Reader tidak valid:",
      zoomLevel
    );

    return false;
  }

  if (
    !Number.isFinite(
      brightnessValue
    ) ||
    brightnessValue < 50 ||
    brightnessValue > 130
  ) {

    logWarn(
      "brightnessLevel Reader tidak valid:",
      brightnessLevel
    );

    return false;
  }

  if (
    !Number.isFinite(
      contrastValue
    ) ||
    contrastValue < 70 ||
    contrastValue > 150
  ) {

    logWarn(
      "contrastLevel Reader tidak valid:",
      contrastLevel
    );

    return false;
  }

  let user = null;

  try {

    const userResult =
      await db.auth.getUser();

    if (
      userResult &&
      userResult.error
    ) {

      logWarn(
        "User Reader gagal dibaca sebelum menyimpan pengaturan:",
        userResult.error
      );

      return false;
    }

    user =
      userResult &&
      userResult.data
        ? userResult.data.user
        : null;

  } catch (
    userException
  ) {

    logError(
      "Terjadi error saat membaca user Reader:",
      userException
    );

    return false;
  }

  if (
    !user ||
    typeof user.id !==
      "string" ||
    !user.id.trim()
  ) {

    logWarn(
      "User Reader belum login atau ID user tidak valid."
    );

    return false;
  }

  let settingsTable =
    null;

  try {

    settingsTable =
      db.from(
        "reader_settings"
      );

  } catch (
    tableError
  ) {

    logError(
      "Tabel reader_settings gagal diakses:",
      tableError
    );

    return false;
  }

  if (
    !settingsTable ||
    typeof settingsTable.upsert !==
      "function"
  ) {

    logWarn(
      "Operasi upsert reader_settings tidak tersedia."
    );

    return false;
  }

  let saveResult =
    null;

  try {

    saveResult =
      await settingsTable.upsert(
        {
          user_id:
            user.id.trim(),

          reading_mode:
            readingModeValue,

          zoom_level:
            zoomValue,

          brightness_level:
            brightnessValue,

          contrast_level:
            contrastValue,

          updated_at:
            new Date()
              .toISOString()
        },
        {
          onConflict:
            "user_id"
        }
      );

  } catch (
    saveException
  ) {

    logError(
      "Terjadi error saat menyimpan pengaturan Reader ke cloud:",
      saveException
    );

    return false;
  }

  if (
    saveResult &&
    saveResult.error
  ) {

    logError(
      "Gagal menyimpan pengaturan Reader ke cloud:",
      saveResult.error
    );

    return false;
  }

  return true;
}

let readerSettingsCloudSaveTimer = null;

function scheduleReaderSettingsCloudSave() {

  const logWarn = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.warn ===
        "function"
    ) {

      console.warn(
        ...args
      );
    }
  };

  const logError = (
    ...args
  ) => {

    if (
      typeof console !==
        "undefined" &&
      typeof console.error ===
        "function"
    ) {

      console.error(
        ...args
      );
    }
  };

  if (
    typeof readerSettingsCloudSaveTimer ===
      "undefined"
  ) {

    logWarn(
      "State timer Reader settings cloud tidak tersedia."
    );

    return false;
  }

  if (
    typeof clearTimeout !==
      "function" ||
    typeof setTimeout !==
      "function"
  ) {

    logWarn(
      "Timer browser tidak tersedia untuk menjadwalkan penyimpanan pengaturan Reader."
    );

    return false;
  }

  try {

    if (
      readerSettingsCloudSaveTimer !==
        null
    ) {

      clearTimeout(
        readerSettingsCloudSaveTimer
      );

      readerSettingsCloudSaveTimer =
        null;
    }

    readerSettingsCloudSaveTimer =
      setTimeout(
        async () => {

          try {

            if (
              typeof saveReaderSettingsToCloud !==
                "function"
            ) {

              return false;
            }

            const berhasil =
              await saveReaderSettingsToCloud();

            return berhasil !==
              false;

          } catch (
            error
          ) {

            if (
              typeof console !==
                "undefined" &&
              typeof console.error ===
                "function"
            ) {

              console.error(
                "Scheduled Reader settings cloud save gagal:",
                error
              );
            }

            return false;
          }
        },
        800
      );

  } catch (
    scheduleError
  ) {

    readerSettingsCloudSaveTimer =
      null;

    logError(
      "Gagal menjadwalkan penyimpanan pengaturan Reader ke cloud:",
      scheduleError
    );

    return false;
  }

  return true;
}

  let toolbarTimer = null;
  let toolbarInteractionActive = false;
  let sliderDragging = false;
  let toolbarPinnedOpen = false;

function scheduleToolbarHide() {
  clearTimeout(toolbarTimer);

  if (
  toolbarPinnedOpen ||
  toolbarInteractionActive ||
  sliderDragging
) {
  return;
}

  toolbarTimer = setTimeout(() => {
    if (
  toolbarPinnedOpen ||
  toolbarInteractionActive ||
  sliderDragging
) {
  return;
}

    const controls =
      document.querySelector(".page-controls");

    const toggle =
      document.getElementById("toolbar-toggle");

    controls.classList.add("toolbar-hidden");
    toggle.textContent = "☰";

    document.getElementById("preset-panel").style.display =
      "none";
  }, 10000);
}

function pauseToolbarHide() {
  toolbarInteractionActive = true;
  clearTimeout(toolbarTimer);
}

function restartToolbarHide() {
  if (
  toolbarPinnedOpen ||
  toolbarInteractionActive ||
  sliderDragging
) {
  return;
}

  const controls =
    document.querySelector(".page-controls");

  if (!controls.classList.contains("toolbar-hidden")) {
    scheduleToolbarHide();
  }
}

function endToolbarInteraction() {
  toolbarInteractionActive = false;

  if (!sliderDragging) {
    restartToolbarHide();
  }
}

const toolbarInteractiveAreas = [
  document.querySelector(".page-controls"),
  document.getElementById("brightness-panel"),
  document.getElementById("contrast-panel"),
  document.getElementById("preset-panel")
];

toolbarInteractiveAreas.forEach((area) => {
  area.addEventListener("pointerdown", () => {
    pauseToolbarHide();
  });

  area.addEventListener("input", restartToolbarHide);
  area.addEventListener("change", restartToolbarHide);

  area.addEventListener("keydown", pauseToolbarHide);
  area.addEventListener("keyup", endToolbarInteraction);
});

const readerSliders = [
  document.getElementById("brightness-slider"),
  document.getElementById("contrast-slider")
];

function startSliderDrag() {
  sliderDragging = true;
  clearTimeout(toolbarTimer);
}

function endSliderDrag() {
  if (!sliderDragging) return;

  sliderDragging = false;
  toolbarInteractionActive = false;
  scheduleToolbarHide();
}

readerSliders.forEach((slider) => {
  slider.addEventListener("pointerdown", startSliderDrag);
});

document.addEventListener("pointerup", () => {
  endSliderDrag();
  endToolbarInteraction();
});

document.addEventListener("pointercancel", () => {
  endSliderDrag();
  endToolbarInteraction();
});
  
  document.getElementById("toolbar-toggle").addEventListener("click", (event) => {
  event.stopPropagation();

  const controls = document.querySelector(".page-controls");
  const toggle = document.getElementById("toolbar-toggle");

  const isHidden =
    controls.classList.contains("toolbar-hidden");

  if (isHidden) {
    toolbarPinnedOpen = true;
    
    controls.classList.remove("toolbar-hidden");
    toggle.textContent = "✕";

    // Dibuka manual lewat Hamburger:
    // jangan tutup otomatis.
    clearTimeout(toolbarTimer);
  } else {
    toolbarPinnedOpen = false;
    
    controls.classList.add("toolbar-hidden");
    toggle.textContent = "☰";

    clearTimeout(toolbarTimer);

    document.getElementById("preset-panel").style.display =
      "none";
  }
});

  let lastBookTap = 0;

document.getElementById("flipbook").addEventListener(
  "pointerdown",
  (event) => {
    if (
  event.target.closest(
    "#toolbar-toggle, .page-controls, #brightness-panel, #contrast-panel, #preset-panel"
  )
) {
  return;
}
    const controls = document.querySelector(".page-controls");
    const toggle = document.getElementById("toolbar-toggle");

    const now = Date.now();
    const isDoubleTap = now - lastBookTap < 350;
    lastBookTap = now;

    if (isDoubleTap) {
      event.preventDefault();
      event.stopPropagation();

      toggleFullscreen();
      return;
    }

    controls.classList.remove("toolbar-hidden");
    toggle.textContent = "✕";

    scheduleToolbarHide();
  },
  true
);
