<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reader | Perpustakaan Nawir Pakaja</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#111827;
      color:white;
    }

    .reader-header{
      height:60px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      background:#0f172a;
      border-bottom:1px solid #334155;
    }

    .reader-header h2{
      margin:0;
      font-size:18px;
    }

    .back-button{
      color:white;
      text-decoration:none;
      background:#2563eb;
      padding:9px 14px;
      border-radius:8px;
    }

    .reader-area{
      min-height:calc(100vh - 60px);
      display:flex;
     align-items:flex-start;
      justify-content:center;
      padding:20px;
    }

    .book{
      width:90%;
      max-width:1000px;
      min-height:600px;
      background:white;
      color:#111827;
      border-radius:12px;
      display:flex;
      flex-direction:column;
      gap:16px;
      align-items:center;
      justify-content:center;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }

    .book p{
      font-size:22px;
    }
    .page-controls{
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;

  display:flex;
  align-items:center;
  gap:12px;

  padding:10px 14px;
  background:#0f172a;
  color:white;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  white-space:nowrap;
}

.page-controls button{
  padding:8px 12px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}
    .page-container{
  perspective:1800px;
}

#pdf-page{
  transform-style:preserve-3d;
  backface-visibility:hidden;
}

#pdf-page.flip-next{
  transform-origin:left center;
  box-shadow:18px 0 28px rgba(0,0,0,.28);
  animation:flipNext .8s cubic-bezier(.55,.05,.45,.95);
}

#pdf-page.flip-prev{
  transform-origin:right center;
  box-shadow:-18px 0 28px rgba(0,0,0,.28);
  animation:flipPrev .8s cubic-bezier(.55,.05,.45,.95);
}

@keyframes flipNext{
  0%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }

  49%{
    transform:rotateY(-89deg) scale(.92);
    opacity:.35;
  }

  50%{
    transform:rotateY(89deg) scale(.92);
    opacity:.35;
  }

  100%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }
}

    @keyframes flipPrev{
  0%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }

  49%{
    transform:rotateY(89deg) scale(.92);
    opacity:.35;
  }

  50%{
    transform:rotateY(-89deg) scale(.92);
    opacity:.35;
  }

  100%{
    transform:rotateY(0deg) scale(1);
    opacity:1;
  }
}
  </style>
  <canvas id="pdf-page"></canvas>
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>

<body>

  <header class="reader-header">
    <h2>📖 Perpustakaan Nawir Pakaja</h2>

    <a href="index.html" class="back-button">
      ← Kembali
    </a>
  </header>

  <main class="reader-area">
    <div class="book" id="flipbook">

  <div class="page-controls">
    <button id="prev-page">◀ Sebelumnya</button>

    <span>
      Halaman <b id="page-num">1</b> /
      <b id="page-count">0</b>
    </span>

    <button id="next-page">Berikutnya ▶</button>
  </div>

  <div id="page-flip"></div>

</div>
  </main>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const params = new URLSearchParams(window.location.search);
  const pdfUrl = params.get("file");

  let pdfDoc = null;
  let pageNum = 1;

  
async function renderPDFPages() {
  const images = [];

  for (let num = 1; num <= pdfDoc.numPages; num++) {
    const page = await pdfDoc.getPage(num);

    const viewport = page.getViewport({ scale: 1.4 });

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    images.push(canvas.toDataURL("image/jpeg", 0.92));
  }

  return images;
}
  let pageFlip = null;

async function loadPDF() {
  if (!pdfUrl) {
    alert("File PDF tidak ditemukan.");
    return;
  }

  pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;

  document.getElementById("page-count").textContent = pdfDoc.numPages;

  const firstPage = await pdfDoc.getPage(1);
  const firstViewport = firstPage.getViewport({ scale: 1 });

  const ratio = firstViewport.height / firstViewport.width;
  const pageWidth = 480;
  const pageHeight = Math.round(pageWidth * ratio);

  const images = await renderPDFPages();

  pageFlip = new St.PageFlip(
    document.getElementById("page-flip"),
    {
      width: pageWidth,
      height: pageHeight,
      size: "stretch",
      minWidth: 280,
      maxWidth: pageWidth,
      minHeight: Math.round(280 * ratio),
      maxHeight: pageHeight,
      drawShadow: true,
      flippingTime: 900,
      usePortrait: true,
      autoSize: true,
      maxShadowOpacity: 0.5,
      showCover: true,
      mobileScrollSupport: false
    }
  );

  pageFlip.on("flip", (e) => {
    pageNum = Number(e.data) + 1;
    document.getElementById("page-num").textContent = pageNum;
  });

  pageFlip.loadFromImages(images);
}

document.getElementById("prev-page").addEventListener("click", () => {
  if (!pageFlip || pageFlip.getCurrentPageIndex() <= 0) return;
  pageFlip.flipPrev("bottom");
});

document.getElementById("next-page").addEventListener("click", () => {
  if (
    !pageFlip ||
    pageFlip.getCurrentPageIndex() >= pageFlip.getPageCount() - 1
  ) return;

  pageFlip.flipNext("bottom");
});
  loadPDF();
</script>
</body>
  
</html>
