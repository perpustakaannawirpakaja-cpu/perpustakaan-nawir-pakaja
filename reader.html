<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reader | Perpustakaan Nawir Pakaja</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#111827;
      color:white;
    }

    .reader-header{
      height:60px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      background:#0f172a;
      border-bottom:1px solid #334155;
    }

    .reader-header h2{
      margin:0;
      font-size:18px;
    }

    .back-button{
      color:white;
      text-decoration:none;
      background:#2563eb;
      padding:9px 14px;
      border-radius:8px;
    }

    .reader-area{
      min-height:calc(100vh - 60px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .book{
      width:90%;
      max-width:1000px;
      min-height:600px;
      background:white;
      color:#111827;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }

    .book p{
      font-size:22px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>

  <header class="reader-header">
    <h2>📖 Perpustakaan Nawir Pakaja</h2>

    <a href="index.html" class="back-button">
      ← Kembali
    </a>
  </header>

  <main class="reader-area">
    <div class="book" id="flipbook">
  <div class="page-container">
  <canvas id="pdf-page"></canvas>
</div>

<div class="page-controls">
  <button id="prev-page">◀ Sebelumnya</button>

  <span>
    Halaman <b id="page-num">1</b> /
    <b id="page-count">0</b>
  </span>

  <button id="next-page">Berikutnya ▶</button>
</div>
</div>
  </main>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const params = new URLSearchParams(window.location.search);
  const pdfUrl = params.get("file");

  let pdfDoc = null;
  let pageNum = 1;

  async function renderPage(num) {

    pageNum = num;
document.getElementById("page-num").textContent = pageNum;
    const page = await pdfDoc.getPage(num);

    const canvas = document.getElementById("pdf-page");
    const context = canvas.getContext("2d");

    const viewport = page.getViewport({ scale: 1.4 });

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;
  }

  async function loadPDF() {
    if (!pdfUrl) {
      alert("File PDF tidak ditemukan.");
      return;
    }

    pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
    document.getElementById("page-count").textContent = pdfDoc.numPages;
    renderPage(pageNum);
  }
document.getElementById("prev-page").addEventListener("click", () => {
  if (pageNum <= 1) return;
  renderPage(pageNum - 1);
});

document.getElementById("next-page").addEventListener("click", () => {
  if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
  renderPage(pageNum + 1);
});
  loadPDF();
</script>
</body>
  
</html>
