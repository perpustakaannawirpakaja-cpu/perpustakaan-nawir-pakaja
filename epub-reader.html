<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>EPUB Reader - Perpustakaan Nawir Pakaja</title>

    <style>
      :root{
        --bg:#f4f7fb;
        --card:#ffffff;
        --text:#172033;
        --muted:#667085;
        --primary:#2563eb;
        --border:#e4e7ec;
      }

      *{
        box-sizing:border-box;
      }

      html,
      body{
        margin:0;
        width:100%;
        height:100%;
      }

      body{
        display:flex;
        flex-direction:column;

        background:var(--bg);
        color:var(--text);

        font-family:
          Arial,
          sans-serif;
      }

      header{
        flex:0 0 auto;

        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;

        padding:10px 12px;

        background:var(--card);

        border-bottom:
          1px solid var(--border);
      }

      .reader-title{
        min-width:0;

        font-size:14px;
        font-weight:700;

        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
      }

      .reader-back{
        flex:0 0 auto;

        padding:8px 10px;

        border:1px solid var(--border);
        border-radius:10px;

        background:var(--card);
        color:var(--text);

        font-size:13px;
        font-weight:700;

        cursor:pointer;
      }

      #viewer{
        flex:1 1 auto;

        min-height:0;
        width:100%;

        background:#ffffff;
      }

      .reader-status{
        flex:0 0 auto;

        min-height:38px;

        display:flex;
        align-items:center;
        justify-content:center;

        padding:8px 12px;

        color:var(--muted);

        font-size:12px;
        text-align:center;

        background:var(--card);

        border-top:
          1px solid var(--border);
      }

      .reader-controls{
        flex:0 0 auto;

        display:grid;
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap:10px;

        padding:
          10px 12px 14px;

        background:var(--card);
      }

      .reader-controls button{
        min-height:44px;

        border:0;
        border-radius:12px;

        background:var(--primary);
        color:#ffffff;

        font-size:15px;
        font-weight:700;

        cursor:pointer;
      }

      .reader-controls button:disabled{
        opacity:.45;
        cursor:not-allowed;
      }

      @media (
        orientation: landscape
      ) and (
        max-height: 700px
      ) {

        body{
          position:relative;
          overflow:hidden;
        }

        header{
          position:absolute;
          top:0;
          left:0;
          right:0;

          z-index:20;

          padding:
            4px 8px;

          background:
            rgba(255,255,255,.92);
        }

        .reader-back{
          padding:
            5px 8px;

          font-size:
            12px;
        }

        .reader-title{
          font-size:
            12px;
        }

        #viewer{
          position:absolute;

          top:44px;
          right:0;
          bottom:44px;
          left:0;

          width:100%;
          height:auto;
        }

        .reader-status{
          position:absolute;

          left:50%;
          bottom:56px;

          z-index:20;

          min-height:0;

          padding:
            3px 10px;

          transform:
            translateX(-50%);

          border:
            1px solid var(--border);

          border-radius:
            12px;

          background:
            rgba(255,255,255,.88);

          font-size:
            11px;
        }

        .reader-controls{
          position:absolute;

          left:8px;
          right:8px;
          bottom:6px;

          z-index:20;

          gap:
            6px;

          padding:0;

          background:
            transparent;
        }

        .reader-controls button{
          min-height:
            34px;

          font-size:
            13px;

          opacity:.90;
        }
      }
    </style>
  </head>

          const halaman = normalisasiHalaman(pageNumber);

      }
      /* === BATAS function simpanProgressEpubLokal === */

      function ambilProgressEpubLokal() {
        const logWarn = (message) => {

          const raw = storage.getItem(key);
          if (raw === null || raw === "") return null;

          const progress = JSON.parse(raw);

          if (typeof progress.cfi !== "string") return null;

          const waktu = typeof progress.updated_at === "string"

          const updatedAt = waktu && Number.isFinite(Date.parse(waktu))

      async function simpanProgressEpubCloud(input) {
        const log = (level, message) => {
          try {
            if (typeof console === "undefined" || !console) return;
            if (level === "warn" && typeof console.warn === "function") {

          }

          if (

            return false;
          }

          const { cfi, pageNumber = null } = input;
          if (typeof cfi !== "string") return false;
          const lokasi = cfi.trim();
          if (
            !lokasi.startsWith("epubcfi(") || !lokasi.endsWith(")") ||
            !lokasi.slice(8, -1).trim()
          ) {
            return false;
          }

          // Pertahankan fallback cloud lama sampai schema aktual diverifikasi.
          const halaman = normalisasiHalaman(pageNumber) ?? 1;
          const updatedAt = new Date().toISOString();

          const client = typeof db !== "undefined" ? db : null;
          if (
            !client || !client.auth ||
            typeof client.auth.getUser !== "function" ||
            typeof client.from !== "function"
          ) {
            log("warn", "Supabase tidak tersedia untuk menyimpan progress EPUB.");
            return false;
          }

          const userResult = await client.auth.getUser();
          if (!userResult || userResult.error !== null) {
            log("warn", "Autentikasi progress EPUB tidak berhasil.");
            return false;
          }

          const userId = userResult.data?.user?.id;
          if (
            typeof userId !== "string" || !userId ||
            userId !== userId.trim()
          ) {
            return false;
          }

          if (epubReadingKey !== key) return false;

          const progressTable = client.from("reader_progress");
          if (!progressTable || typeof progressTable.upsert !== "function") {
            log("warn", "API upsert reader_progress tidak tersedia.");
            return false;

          const result = await progressTable.upsert(
            {

      /* === BATAS function simpanProgressEpubCloud === */

      let epubProgressCloudSaveTimer =

      /* === TOP LEVEL FUNCTION === */
      function jadwalkanSimpanProgressEpubCloud(input) {
        const logWarn = (message) => {
          try {
            if (
              typeof console !== "undefined" && console &&
              typeof console.warn === "function"
            ) {

        try {

          const key = epubReadingKey;

          ) {
            return false;
          }

          let halaman = pageNumber;
          if (typeof halaman === "string") {
            const text = halaman.trim();
            halaman = /^\d+$/.test(text) ? Number(text) : null;

          if (!Number.isSafeInteger(halaman) || halaman <= 0) {

            typeof setTimeout !== "function" ||
            typeof clearTimeout !== "function" ||

            return false;

          const scheduler = jadwalkanSimpanProgressEpubCloud;
          const previousTimer = epubProgressCloudSaveTimer;
          const token = { started: false };
          const isCurrent = () => (
            scheduler.latest === token &&
            epubReadingKey === key && rendition === activeRendition

          const timer = setTimeout(
            /* CALLBACK setTimeout() EPUB Progress Cloud Save */

                epubProgressCloudSaveTimer = null;

                  }
                  /* Batas CALLBACK Promise.then() EPUB Progress Cloud Save */
                );

                } catch (error) {
                  logWarn("Event orientationchange EPUB gagal diproses.");
                  return false;
                }
              }
              /* Batas CALLBACK orientationchange EPUB Reader */
            );
          }
        } catch (error) {
          logWarn("Pemasangan event orientationchange EPUB gagal.");
        }
      }
      /* === BATAS EVENT window/orientationchange === */

      /* === BOOTSTRAP BUKA EPUB === */
      (async () => {
        const logError = (message) => {
          try {
            if (typeof console !== "undefined" && console &&
                typeof console.error === "function") console.error(message);
          } catch (error) {
            // Logger tidak boleh mengganggu bootstrap EPUB Reader.
          }
        };

        let owner = null;
        let session = null;
        const tampilkanGagal = () => {
          try {
            // Jangan menimpa sesi aktif, sesi pengganti, atau proses keluar.
            if (owner?.closing || owner?.session?.ready ||
                (owner?.session && owner.session !== session)) return;
          } catch (error) {
            logError("Identitas sesi bootstrap EPUB gagal diperiksa.");
            return;
          }

          // Pesan spesifik dari Unit 15 lebih informatif daripada fallback umum.
          try {
            if (typeof status !== "undefined" && status &&
                !(typeof status.textContent === "string" &&
                  status.textContent.trim().startsWith("❌"))) {
              status.textContent = "❌ EPUB gagal disiapkan. Silakan kembali ke koleksi.";
            }
          } catch (error) {
            logError("Status kegagalan bootstrap EPUB gagal ditampilkan.");
          }
          for (const getButton of [() => prevButton, () => nextButton]) {
            try {
              const button = getButton();
              if (button) button.disabled = true;
            } catch (error) {
              logError("Tombol navigasi EPUB gagal dinonaktifkan.");
            }
          }
          // Tombol Kembali dan data progress tidak diubah oleh bootstrap.
        };

        try {
          if (typeof bukaEpub !== "function") {
            logError("Function bukaEpub() tidak tersedia saat bootstrap.");
            tampilkanGagal();
            return false;
          }
          owner = bukaEpub;
          if (owner.opening || owner.closing) return false;

          // Unit 15 menetapkan session secara sinkron sebelum await pertama.
          const pending = owner();
          session = owner.session;
          const result = await pending;
          if (result === true) return true;

          logError("Bootstrap EPUB selesai tanpa status berhasil.");
          tampilkanGagal();
          return false;
        } catch (error) {
          logError("Eksekusi bootstrap EPUB gagal.");
          tampilkanGagal();
          return false;
        }
      })();
      /* === BATAS BOOTSTRAP BUKA EPUB === */
    </script>

  </body>
