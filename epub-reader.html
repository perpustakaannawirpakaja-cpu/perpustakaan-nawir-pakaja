<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>EPUB Reader - Perpustakaan Nawir Pakaja</title>

<style>
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --primary:#2563eb;
  --border:#e4e7ec;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  display:flex;
  flex-direction:column;

  background:var(--bg);
  color:var(--text);

  font-family:
    Arial,
    sans-serif;
}

header{
  flex:0 0 auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:10px 12px;

  background:var(--card);

  border-bottom:
    1px solid var(--border);
}

.reader-title{
  min-width:0;

  font-size:14px;
  font-weight:700;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.reader-back{
  flex:0 0 auto;

  padding:8px 10px;

  border:1px solid var(--border);
  border-radius:10px;

  background:var(--card);
  color:var(--text);

  font-size:13px;
  font-weight:700;

  cursor:pointer;
}

#viewer{
  flex:1 1 auto;

  min-height:0;
  width:100%;

  background:#ffffff;
}

.reader-status{
  flex:0 0 auto;

  min-height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:8px 12px;

  color:var(--muted);

  font-size:12px;
  text-align:center;

  background:var(--card);

  border-top:
    1px solid var(--border);
}

.reader-controls{
  flex:0 0 auto;

  display:grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap:10px;

  padding:
    10px 12px 14px;

  background:var(--card);
}

.reader-controls button{
  min-height:44px;

  border:0;
  border-radius:12px;

  background:var(--primary);
  color:#ffffff;

  font-size:15px;
  font-weight:700;

  cursor:pointer;
}

.reader-controls button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
</style>
</head>

<body>

<header>

  <button
    type="button"
    class="reader-back"
    id="back-btn"
  >
    ← Kembali
  </button>

  <div
    class="reader-title"
    id="reader-title"
  >
    EPUB Reader
  </div>

</header>

<div id="viewer"></div>

<div
  class="reader-status"
  id="reader-status"
  aria-live="polite"
>
  Menyiapkan EPUB...
</div>

<div class="reader-controls">

  <button
    type="button"
    id="prev-btn"
    disabled
  >
    ← Sebelumnya
  </button>

  <button
    type="button"
    id="next-btn"
    disabled
  >
    Berikutnya →
  </button>

</div>

<script
  src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
></script>

<script
  src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"
></script>

<script>
const viewer =
  document.getElementById(
    "viewer"
  );

const status =
  document.getElementById(
    "reader-status"
  );

const title =
  document.getElementById(
    "reader-title"
  );

const prevButton =
  document.getElementById(
    "prev-btn"
  );

const nextButton =
  document.getElementById(
    "next-btn"
  );

const backButton =
  document.getElementById(
    "back-btn"
  );

let epubBook =
  null;

let rendition =
  null;

function ambilUrlEpub() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const file =
    params.get(
      "file"
    );

  if (!file) {
    return null;
  }

  try {

    const url =
      new URL(
        file,
        window.location.href
      );

    if (
      url.protocol !== "https:" &&
      url.protocol !== "http:"
    ) {
      return null;
    }

    return url.href;

  } catch (error) {

    console.error(
      "URL EPUB tidak valid:",
      error
    );

    return null;
  }
}

async function bukaEpub() {

  const epubUrl =
    ambilUrlEpub();

  if (!epubUrl) {

    status.textContent =
      "❌ URL EPUB tidak ditemukan atau tidak valid.";

    return;
  }

  if (
    typeof ePub !==
    "function"
  ) {

    status.textContent =
      "❌ Mesin EPUB belum berhasil dimuat.";

    return;
  }

  try {

    status.textContent =
      "⏳ Membuka EPUB...";

    epubBook =
      ePub(
        epubUrl
      );

    rendition =
      epubBook.renderTo(
        viewer,
        {
          width:
            "100%",

          height:
            "100%",

          flow:
            "paginated",

          spread:
            "none"
        }
      );

    const metadata =
      await epubBook.loaded.metadata;

    if (
      metadata?.title
    ) {
      title.textContent =
        metadata.title;

      document.title =
        metadata.title +
        " - Perpustakaan Nawir Pakaja";
    }

    await rendition.display();

    prevButton.disabled =
      false;

    nextButton.disabled =
      false;

    status.textContent =
      "✅ EPUB berhasil dibuka.";

    rendition.on(
      "relocated",
      function (location) {

        const current =
          location?.start
            ?.displayed
            ?.page;

        const total =
          location?.start
            ?.displayed
            ?.total;

        if (
          current &&
          total
        ) {
          status.textContent =
            `Halaman ${current} / ${total}`;
        }
      }
    );

  } catch (error) {

    console.error(
      "Gagal membuka EPUB:",
      error
    );

    status.textContent =
      "❌ EPUB gagal dibuka.";

    prevButton.disabled =
      true;

    nextButton.disabled =
      true;
  }
}

prevButton.addEventListener(
  "click",
  async () => {

    if (!rendition) {
      return;
    }

    await rendition.prev();
  }
);

nextButton.addEventListener(
  "click",
  async () => {

    if (!rendition) {
      return;
    }

    await rendition.next();
  }
);

backButton.addEventListener(
  "click",
  () => {

    if (
      window.history.length >
      1
    ) {
      window.history.back();
      return;
    }

    window.location.href =
      "index.html";
  }
);

window.addEventListener(
  "keydown",
  async (event) => {

    if (!rendition) {
      return;
    }

    if (
      event.key ===
      "ArrowLeft"
    ) {
      event.preventDefault();
      await rendition.prev();
    }

    if (
      event.key ===
      "ArrowRight"
    ) {
      event.preventDefault();
      await rendition.next();
    }
  }
);

bukaEpub();
</script>

</body>
</html>
