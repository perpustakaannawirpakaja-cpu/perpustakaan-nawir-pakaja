<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>EPUB Reader - Perpustakaan Nawir Pakaja</title>

<style>
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --primary:#2563eb;
  --border:#e4e7ec;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  display:flex;
  flex-direction:column;

  background:var(--bg);
  color:var(--text);

  font-family:
    Arial,
    sans-serif;
}

header{
  flex:0 0 auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:10px 12px;

  background:var(--card);

  border-bottom:
    1px solid var(--border);
}

.reader-title{
  min-width:0;

  font-size:14px;
  font-weight:700;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.reader-back{
  flex:0 0 auto;

  padding:8px 10px;

  border:1px solid var(--border);
  border-radius:10px;

  background:var(--card);
  color:var(--text);

  font-size:13px;
  font-weight:700;

  cursor:pointer;
}

#viewer{
  flex:1 1 auto;

  min-height:0;
  width:100%;

  background:#ffffff;
}

#viewer .epub-view{
  margin-left:auto !important;
  margin-right:auto !important;
}

.reader-status{
  flex:0 0 auto;

  min-height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:8px 12px;

  color:var(--muted);

  font-size:12px;
  text-align:center;

  background:var(--card);

  border-top:
    1px solid var(--border);
}

.reader-controls{
  flex:0 0 auto;

  display:grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap:10px;

  padding:
    10px 12px 14px;

  background:var(--card);
}

.reader-controls button{
  min-height:44px;

  border:0;
  border-radius:12px;

  background:var(--primary);
  color:#ffffff;

  font-size:15px;
  font-weight:700;

  cursor:pointer;
}

.reader-controls button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
</style>
</head>

<body>

<header>

  <button
    type="button"
    class="reader-back"
    id="back-btn"
  >
    ← Kembali
  </button>

  <div
    class="reader-title"
    id="reader-title"
  >
    EPUB Reader
  </div>

</header>

<div id="viewer"></div>

<div
  class="reader-status"
  id="reader-status"
  aria-live="polite"
>
  Menyiapkan EPUB...
</div>

<div class="reader-controls">

  <button
    type="button"
    id="prev-btn"
    disabled
  >
    ← Sebelumnya
  </button>

  <button
    type="button"
    id="next-btn"
    disabled
  >
    Berikutnya →
  </button>

</div>

<script
  src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
></script>

<script
  src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"
></script>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script>
const SUPABASE_URL =
  "https://lacdmofkvrmygwczoeux.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_vu1p7MFzan_Dqx_58B8dmQ_V14Hm0Vj";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  
const viewer =
  document.getElementById(
    "viewer"
  );

const status =
  document.getElementById(
    "reader-status"
  );

const title =
  document.getElementById(
    "reader-title"
  );

const prevButton =
  document.getElementById(
    "prev-btn"
  );

const nextButton =
  document.getElementById(
    "next-btn"
  );

const backButton =
  document.getElementById(
    "back-btn"
  );

let epubBook =
  null;

let rendition =
  null;

let epubReadingKey =
  null;

let epubResizeTimer =
  null;

let epubViewerWidth =
  0;

let epubViewerHeight =
  0;

function buatEpubReadingKey(
  epubUrl
) {

  if (
    typeof epubUrl !==
      "string" ||
    !epubUrl.trim()
  ) {
    return null;
  }

  return (
    "lastEpub:" +
    encodeURIComponent(
      epubUrl.trim()
    )
  );
}

function simpanProgressEpubLokal({
  cfi,
  pageNumber = null,
  totalPages = null
}) {

  if (
    !epubReadingKey ||
    typeof cfi !== "string" ||
    !cfi.trim()
  ) {
    return;
  }

  const progress = {
    cfi: cfi.trim(),
    page_number:
  pageNumber !== null &&
  pageNumber !== undefined &&
  Number.isFinite(
    Number(pageNumber)
  )
    ? Number(pageNumber)
    : null,

total_pages:
  totalPages !== null &&
  totalPages !== undefined &&
  Number.isFinite(
    Number(totalPages)
  )
    ? Number(totalPages)
    : null,

    updated_at:
      new Date().toISOString()
  };

  localStorage.setItem(
    epubReadingKey,
    JSON.stringify(
      progress
    )
  );
}

function ambilProgressEpubLokal() {

  if (!epubReadingKey) {
    return null;
  }

  const raw =
    localStorage.getItem(
      epubReadingKey
    );

  if (!raw) {
    return null;
  }

  try {

    const progress =
      JSON.parse(raw);

    if (
      !progress ||
      typeof progress.cfi !==
        "string" ||
      !progress.cfi.trim()
    ) {
      return null;
    }

    return {
      ...progress,
      cfi:
        progress.cfi.trim()
    };

  } catch (error) {

    console.warn(
      "Progress EPUB lokal tidak valid:",
      error
    );

    return null;
  }
}

async function simpanProgressEpubCloud({
  cfi,
  pageNumber = null
}) {

  if (
    !epubReadingKey ||
    typeof cfi !== "string" ||
    !cfi.trim()
  ) {
    return;
  }

  const {
    data: { user },
    error: userError
  } = await db.auth.getUser();

  if (
    userError ||
    !user
  ) {
    return;
  }

  const halaman =
    pageNumber !== null &&
    pageNumber !== undefined &&
    Number.isFinite(
      Number(pageNumber)
    )
      ? Math.max(
          1,
          Math.trunc(
            Number(pageNumber)
          )
        )
      : 1;

  const { error } =
    await db
      .from("reader_progress")
      .upsert(
        {
          user_id:
            user.id,

          book_key:
            epubReadingKey,

          page_number:
            halaman,

          reader_type:
            "epub",

          location_cfi:
            cfi.trim(),

          updated_at:
            new Date().toISOString()
        },
        {
          onConflict:
            "user_id,book_key"
        }
      );

  if (error) {

    console.error(
      "Gagal menyimpan progress EPUB ke cloud:",
      error
    );
  }
}

let epubProgressCloudSaveTimer =
  null;

function jadwalkanSimpanProgressEpubCloud({
  cfi,
  pageNumber = null
}) {

  clearTimeout(
    epubProgressCloudSaveTimer
  );

  epubProgressCloudSaveTimer =
    setTimeout(
      () => {

        simpanProgressEpubCloud({
          cfi,
          pageNumber
        });

      },
      800
    );
}

async function ambilProgressEpubCloud() {

  if (!epubReadingKey) {
    return null;
  }

  const {
    data: { user },
    error: userError
  } = await db.auth.getUser();

  if (
    userError ||
    !user
  ) {
    return null;
  }

  const {
    data,
    error
  } = await db
    .from("reader_progress")
    .select(
      "page_number, location_cfi, updated_at"
    )
    .eq(
      "user_id",
      user.id
    )
    .eq(
      "book_key",
      epubReadingKey
    )
    .eq(
      "reader_type",
      "epub"
    )
    .maybeSingle();

  if (error) {

    console.error(
      "Gagal mengambil progress EPUB dari cloud:",
      error
    );

    return null;
  }

  if (
    !data ||
    typeof data.location_cfi !==
      "string" ||
    !data.location_cfi.trim()
  ) {
    return null;
  }

  return {
    cfi:
      data.location_cfi.trim(),

    page_number:
      data.page_number,

    updated_at:
      data.updated_at
  };
}

function pilihProgressEpubTerbaru(
  progressLokal,
  progressCloud
) {

  if (
    !progressLokal &&
    !progressCloud
  ) {
    return null;
  }

  if (!progressLokal) {
    return progressCloud;
  }

  if (!progressCloud) {
    return progressLokal;
  }

  const waktuLokal =
    Date.parse(
      progressLokal.updated_at || ""
    );

  const waktuCloud =
    Date.parse(
      progressCloud.updated_at || ""
    );

  if (
    Number.isFinite(waktuCloud) &&
    (
      !Number.isFinite(waktuLokal) ||
      waktuCloud > waktuLokal
    )
  ) {
    return progressCloud;
  }

  return progressLokal;
}

function ambilUrlEpub() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const file =
    params.get(
      "file"
    );

  if (!file) {
    return null;
  }

  try {

    const url =
      new URL(
        file,
        window.location.href
      );

    if (
      url.protocol !== "https:" &&
      url.protocol !== "http:"
    ) {
      return null;
    }

    return url.href;

  } catch (error) {

    console.error(
      "URL EPUB tidak valid:",
      error
    );

    return null;
  }
}

function pasangSwipeEpub(
  contents
) {

  const doc =
    contents?.document;

  if (!doc) {
    return;
  }

  let startX = 0;
  let startY = 0;

  doc.addEventListener(
    "touchstart",
    (event) => {

      const touch =
        event.touches?.[0];

      if (!touch) {
        return;
      }

      startX =
        touch.clientX;

      startY =
        touch.clientY;
    },
    {
      passive: true
    }
  );

  doc.addEventListener(
    "touchend",
    async (event) => {

      const touch =
        event.changedTouches?.[0];

      if (!touch || !rendition) {
        return;
      }

      const deltaX =
        touch.clientX - startX;

      const deltaY =
        touch.clientY - startY;

      const jarakX =
        Math.abs(deltaX);

      const jarakY =
        Math.abs(deltaY);

      if (
        jarakX < 50 ||
        jarakX <= jarakY
      ) {
        return;
      }

      if (
        deltaX < 0 &&
        !nextButton.disabled
      ) {
        await rendition.next();
        return;
      }

      if (
        deltaX > 0 &&
        !prevButton.disabled
      ) {
        await rendition.prev();
      }
    },
    {
      passive: true
    }
  );
}

function tungguLayoutEpubStabil() {

  return new Promise(
    (resolve) => {

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            resolve
          );
        }
      );
    }
  );
}

function jadwalkanResizeEpub() {

  clearTimeout(
    epubResizeTimer
  );

  epubResizeTimer =
    setTimeout(
      async () => {

        if (
          !rendition ||
          !viewer
        ) {
          return;
        }

        await tungguLayoutEpubStabil();

        const lokasi =
          rendition.currentLocation();

        const cfi =
          lokasi?.start?.cfi || null;

        const rect =
          viewer.getBoundingClientRect();

        const width =
          Math.max(
            1,
            Math.round(
              rect.width
            )
          );

        const height =
          Math.max(
            1,
            Math.round(
              rect.height
            )
          );

        if (
          width === epubViewerWidth &&
          height === epubViewerHeight
        ) {
          return;
        }

        try {

          rendition.resize(
            width,
            height
          );

          if (cfi) {

            await rendition.display(
              cfi
            );
          }

          epubViewerWidth =
            width;

          epubViewerHeight =
            height;

        } catch (error) {

          console.warn(
            "Resize EPUB gagal:",
            error
          );
        }

      },
      180
    );
}

async function bukaEpub() {

  const epubUrl =
    ambilUrlEpub();

  epubReadingKey =
  buatEpubReadingKey(
    epubUrl
  );

  if (!epubUrl) {

    status.textContent =
      "❌ URL EPUB tidak ditemukan atau tidak valid.";

    return;
  }

  if (
    typeof ePub !==
    "function"
  ) {

    status.textContent =
      "❌ Mesin EPUB belum berhasil dimuat.";

    return;
  }

  try {

    status.textContent =
      "⏳ Membuka EPUB...";

    epubBook =
      ePub(
        epubUrl
      );

    rendition =
      epubBook.renderTo(
        viewer,
        {
          width:
            "100%",

          height:
            "100%",

          flow:
            "paginated",

          spread:
            "none"
        }
      );

    rendition.hooks.content.register(
      pasangSwipeEpub
    );

    rendition.on(
      "relocated",
      function (location) {

    const spineIndex =
  Number(
    location?.start?.index
  );

const totalSpine =
  Array.isArray(
    epubBook?.spine?.spineItems
  )
    ? epubBook.spine.spineItems.length
    : 0;

const current =
  Number.isInteger(spineIndex)
    ? spineIndex + 1
    : (
        location?.start
          ?.displayed
          ?.page || 1
      );

const total =
  totalSpine > 0
    ? totalSpine
    : (
        location?.start
          ?.displayed
          ?.total || 1
      );

    const cfi =
      location?.start
        ?.cfi;

    if (
      current &&
      total
    ) {
      status.textContent =
        `Halaman ${current} / ${total}`;
    }

    prevButton.disabled =
      current <= 1;

    nextButton.disabled =
      current >= total;

    simpanProgressEpubLokal({
      cfi,
      pageNumber: current,
      totalPages: total
    });

    jadwalkanSimpanProgressEpubCloud({
      cfi,
      pageNumber: current
    });
        
  }
);

    const metadata =
      await epubBook.loaded.metadata;

    if (
      metadata?.title
    ) {
      title.textContent =
        metadata.title;

      document.title =
        metadata.title +
        " - Perpustakaan Nawir Pakaja";
    }

    const progressLokal =
      ambilProgressEpubLokal();

    const progressCloud =
      await ambilProgressEpubCloud();

    const progressTerbaru =
      pilihProgressEpubTerbaru(
        progressLokal,
        progressCloud
      );

    if (
      progressTerbaru?.cfi
    ) {

      try {

        await rendition.display(
          progressTerbaru.cfi
        );

        console.log(
          "Resume EPUB dari progress terbaru:",
          progressTerbaru.cfi
        );

      } catch (error) {

        console.warn(
          "Resume EPUB gagal, membuka dari awal:",
          error
        );

        await rendition.display();
      }

    } else {

      await rendition.display();
    }

    status.textContent =
      "✅ EPUB berhasil dibuka.";
    
  } catch (error) {

    console.error(
      "Gagal membuka EPUB:",
      error
    );

    status.textContent =
      "❌ EPUB gagal dibuka.";

    prevButton.disabled =
      true;

    nextButton.disabled =
      true;
  }
}

prevButton.addEventListener(
  "click",
  async () => {

    if (!rendition) {
      return;
    }

    await rendition.prev();
  }
);

nextButton.addEventListener(
  "click",
  async () => {

    if (!rendition) {
      return;
    }

    await rendition.next();
  }
);

backButton.addEventListener(
  "click",
  () => {

    if (
      window.history.length >
      1
    ) {
      window.history.back();
      return;
    }

    window.location.href =
      "index.html";
  }
);

window.addEventListener(
  "keydown",
  async (event) => {

    if (!rendition) {
      return;
    }

    if (
      event.key ===
      "ArrowLeft"
    ) {
      event.preventDefault();
      await rendition.prev();
    }

    if (
      event.key ===
      "ArrowRight"
    ) {
      event.preventDefault();
      await rendition.next();
    }
  }
);

window.addEventListener(
  "resize",
  jadwalkanResizeEpub
);

window.addEventListener(
  "orientationchange",
  jadwalkanResizeEpub
);

bukaEpub();
</script>

</body>
</html>
